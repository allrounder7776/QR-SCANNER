<script>

/* ================================
   GOOGLE / SHEET SETTINGS
================================ */

const CLIENT_ID =
"308840508820-b3qjh155tuj3jl53fqudm2aadk0omm8s.apps.googleusercontent.com";

const SPREADSHEET_ID =
"19CzQLHAihdyNl51W4nzcfzlYGs5V6n1PcOxCWW-nxRg";

const SHEET_NAME = "Sheet1";

const PIN_SHEET_NAME = "PIN CODE";

const SHEETS_SCOPE =
"https://www.googleapis.com/auth/spreadsheets";


/* ================================
   VARIABLES
================================ */

let accessToken = null;
let tokenClient = null;

let scanner = null;
let scanning = false;
let saving = false;

let nextRow = 2;

const LOGIN_MEMORY_KEY =
"qr_scanner_google_connected";


/* ================================
   MESSAGE
================================ */

function showMessage(text, type) {

  const box =
    document.getElementById("message");

  box.innerHTML = text;

  box.className =
    type || "info";
}


/* ================================
   PAGE LOAD
================================ */

window.addEventListener("load", function() {

  initializeGoogle();

});


/* ================================
   GOOGLE INITIALIZE
================================ */

function initializeGoogle() {

  if (
    typeof google === "undefined" ||
    !google.accounts ||
    !google.accounts.oauth2
  ) {

    showMessage(
      "❌ Google Login load नहीं हुआ",
      "error"
    );

    return;
  }


  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id: CLIENT_ID,

      scope: SHEETS_SCOPE,

      callback: handleTokenResponse

    });


  const remembered =
    localStorage.getItem(LOGIN_MEMORY_KEY);


  if (remembered === "YES") {

    autoConnect();

  } else {

    showMessage(
      "🔐 Google Account Connect करें",
      "info"
    );

  }

}


/* ================================
   AUTO CONNECT
================================ */

function autoConnect() {

  try {

    tokenClient.requestAccessToken({
      prompt: ""
    });

  }

  catch (error) {

    showLoginButton();

  }

}


/* ================================
   LOGIN BUTTON
================================ */

function showLoginButton() {

  document.getElementById("loginBtn")
    .style.display = "block";

  showMessage(
    "🔐 Google Account Connect करें",
    "info"
  );

}


document
.getElementById("loginBtn")
.addEventListener("click", function() {

  if (!tokenClient) {

    showMessage(
      "❌ Google Login तैयार नहीं है",
      "error"
    );

    return;
  }


  showMessage(
    "⏳ Google authorization...",
    "info"
  );


  tokenClient.requestAccessToken({
    prompt: ""
  });

});


/* ================================
   TOKEN RESPONSE
================================ */

function handleTokenResponse(response) {

  if (response.error) {

    accessToken = null;

    localStorage.removeItem(
      LOGIN_MEMORY_KEY
    );

    showLoginButton();

    showMessage(
      "❌ Google authorization failed<br>" +
      (
        response.error_description ||
        response.error
      ),
      "error"
    );

    return;
  }


  if (!response.access_token) {

    accessToken = null;

    showLoginButton();

    showMessage(
      "❌ Access token नहीं मिला",
      "error"
    );

    return;
  }


  accessToken =
    response.access_token;


  localStorage.setItem(
    LOGIN_MEMORY_KEY,
    "YES"
  );


  document.getElementById("loginBtn")
    .style.display = "none";


  testSheetAccess();

}


/* ================================
   TEST SHEET
================================ */

async function testSheetAccess() {

  try {

    const url =
      "https://sheets.googleapis.com/v4/spreadsheets/" +
      SPREADSHEET_ID;


    const response =
      await fetch(url, {

        headers: {
          "Authorization":
            "Bearer " + accessToken
        }

      });


    const text =
      await response.text();


    let result;

    try {

      result =
        JSON.parse(text);

    }

    catch {

      throw new Error(
        "Google Sheet response invalid है"
      );

    }


    if (!response.ok) {

      if (
        response.status === 401 ||
        response.status === 403
      ) {

        accessToken = null;

        localStorage.removeItem(
          LOGIN_MEMORY_KEY
        );

        showLoginButton();

      }


      throw new Error(
        result.error?.message ||
        "Google Sheet access failed"
      );

    }


    const sheets =
      result.sheets || [];


    let mainFound = false;
    let pinFound = false;


    for (
      let i = 0;
      i < sheets.length;
      i++
    ) {

      const title =
        sheets[i].properties?.title;


      if (title === SHEET_NAME)
        mainFound = true;


      if (title === PIN_SHEET_NAME)
        pinFound = true;

    }


    if (!mainFound)
      throw new Error(
        "Sheet1 नहीं मिली"
      );


    if (!pinFound)
      throw new Error(
        "PIN CODE sheet नहीं मिली"
      );


    await findNextEntryRow();


    showMessage(
      "✅ Google Account Connected<br>📷 अब QR Scan करें",
      "success"
    );


    startScanner();

  }

  catch (error) {

    showMessage(
      "❌ Sheet access failed<br>" +
      error.message,
      "error"
    );

  }

}


/* ================================
   FIND NEXT ROW
   COLUMN C BASED
================================ */

async function findNextEntryRow() {

  nextRow = 2;


  const range =
    encodeURIComponent(
      SHEET_NAME + "!C2:C"
    );


  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    range;


  const response =
    await fetch(url, {

      headers: {
        "Authorization":
          "Bearer " + accessToken
      }

    });


  const text =
    await response.text();


  let result;

  try {

    result =
      JSON.parse(text);

  }

  catch {

    throw new Error(
      "Column C response invalid है"
    );

  }


  if (!response.ok) {

    throw new Error(
      result.error?.message ||
      "Column C पढ़ नहीं पाए"
    );

  }


  const values =
    result.values || [];


  for (
    let i = 0;
    i < values.length;
    i++
  ) {

    const name =
      values[i] &&
      values[i][0] !== undefined
        ? String(values[i][0]).trim()
        : "";


    if (name === "") {

      nextRow = i + 2;

      return;

    }

  }


  nextRow =
    values.length + 2;

}


/* ================================
   START SCANNER
================================ */

function startScanner() {

  if (scanner) return;


  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width: 280,
      height: 280
    },

    aspectRatio: 1.0

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    onScanFailure

  )

  .then(function() {

    scanning = true;

    showMessage(
      "📷 QR Code Scan करें...",
      "info"
    );

  })

  .catch(function(error) {

    showMessage(
      "❌ Camera start नहीं हुआ<br>" +
      error,
      "error"
    );

  });

}


/* ================================
   QR SUCCESS
================================ */

async function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (!scanning || saving)
    return;


  saving = true;

  scanning = false;


  /* BEEP IMMEDIATELY */

  beep();


  showMessage(
    "⏳ QR पढ़ लिया गया...<br>Entry save हो रही है...",
    "info"
  );


  try {

    await findNextEntryRow();


    const rowToSave =
      nextRow;


    const row =
      convertQRToRow(decodedText);


    const pinCode =
      row[3] !== undefined
        ? String(row[3]).trim()
        : "";


    const existingData =
      await readCourierData(
        rowToSave
      );


    let oldCourier =
      existingData.oldCourier;


    if (oldCourier === "#N/A")
      oldCourier = "";


    if (
      oldCourier === "" &&
      existingData.currentCourier !== "" &&
      existingData.currentCourier !== "#N/A"
    ) {

      oldCourier =
        existingData.currentCourier;

    }


    let courier = "";


    if (pinCode !== "") {

      courier =
        await findCourierByPin(
          pinCode
        );

    }


    if (courier === "")
      courier = "#N/A";


    await saveEntry(
      row,
      rowToSave,
      courier,
      oldCourier
    );


    showMessage(
      "✅ Entry Successfully Save हो गई<br>" +
      "Row No: " +
      rowToSave,
      "success"
    );


    nextRow =
      rowToSave + 1;


    setTimeout(function() {

      saving = false;

      scanning = true;

      showMessage(
        "📷 अगला QR Code Scan करें...",
        "info"
      );

    }, 300);

  }

  catch (error) {

    console.error(error);


    showMessage(
      "❌ Entry Save नहीं हुई<br><br>" +
      error.message,
      "error"
    );


    setTimeout(function() {

      saving = false;

      scanning = true;

      showMessage(
        "📷 फिर से QR Code Scan करें...",
        "error"
      );

    }, 3000);

  }

}


/* ================================
   READ J:K
================================ */

async function readCourierData(rowNumber) {

  const range =
    encodeURIComponent(
      SHEET_NAME +
      "!J" +
      rowNumber +
      ":K" +
      rowNumber
    );


  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    range;


  const response =
    await fetch(url, {

      headers: {
        "Authorization":
          "Bearer " + accessToken
      }

    });


  const text =
    await response.text();


  let result;

  try {

    result =
      JSON.parse(text);

  }

  catch {

    throw new Error(
      "Courier data invalid है"
    );

  }


  if (!response.ok) {

    throw new Error(
      result.error?.message ||
      "Courier data पढ़ नहीं पाए"
    );

  }


  const values =
    result.values &&
    result.values[0]
      ? result.values[0]
      : [];


  return {

    currentCourier:
      values[0] !== undefined
        ? String(values[0]).trim()
        : "",

    oldCourier:
      values[1] !== undefined
        ? String(values[1]).trim()
        : ""

  };

}


/* ================================
   FIND COURIER
================================ */

async function findCourierByPin(pinCode) {

  const range =
    encodeURIComponent(
      PIN_SHEET_NAME + "!A:B"
    );


  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    range;


  const response =
    await fetch(url, {

      headers: {
        "Authorization":
          "Bearer " + accessToken
      }

    });


  const text =
    await response.text();


  let result;

  try {

    result =
      JSON.parse(text);

  }

  catch {

    throw new Error(
      "PIN CODE data invalid है"
    );

  }


  if (!response.ok) {

    throw new Error(
      result.error?.message ||
      "PIN CODE sheet पढ़ नहीं पाए"
    );

  }


  const values =
    result.values || [];


  const searchPin =
    String(pinCode).trim();


  for (
    let i = 0;
    i < values.length;
    i++
  ) {

    const sheetPin =
      values[i] &&
      values[i][0] !== undefined
        ? String(values[i][0]).trim()
        : "";


    if (sheetPin === searchPin) {

      const courier =
        values[i][1] !== undefined
          ? String(values[i][1]).trim()
          : "";


      return courier;

    }

  }


  return "";

}


/* ================================
   QR → ROW
================================ */

function convertQRToRow(qrText) {

  let data = null;


  try {

    data =
      JSON.parse(qrText);

  }

  catch {

    data = null;

  }


  if (
    data &&
    typeof data === "object"
  ) {

    return [

      data.date ||
      data.DATE ||
      getToday(),

      data.awb ||
      data.AWB ||
      "",

      data.name ||
      data.NAME ||
      "",

      data.destination ||
      data.DESTINATION ||
      "",

      data.articleNo ||
      data.article_no ||
      data.article ||
      "",

      data.weight ||
      data.WEIGHT ||
      "",

      data.mobile ||
      data.mobileNo ||
      data.mobile_no ||
      "",

      data.order ||
      data.orderNo ||
      data.order_no ||
      "",

      data.live ||
      data.liveNo ||
      data.live_no ||
      ""

    ];

  }


  return [

    getToday(),

    qrText,

    "",

    "",

    "",

    "",

    "",

    "",

    ""

  ];

}


/* ================================
   SAVE ENTRY
================================ */

async function saveEntry(
  row,
  rowToSave,
  courier,
  oldCourier
) {

  if (!accessToken) {

    throw new Error(
      "Google Account Connected नहीं है"
    );

  }


  /* READ EXISTING A:I */

  const readRange =
    encodeURIComponent(
      SHEET_NAME +
      "!A" +
      rowToSave +
      ":I" +
      rowToSave
    );


  const readUrl =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    readRange;


  const readResponse =
    await fetch(readUrl, {

      headers: {
        "Authorization":
          "Bearer " + accessToken
      }

    });


  const readText =
    await readResponse.text();


  let readResult;


  try {

    readResult =
      JSON.parse(readText);

  }

  catch {

    throw new Error(
      "Existing row invalid है"
    );

  }


  if (!readResponse.ok) {

    throw new Error(
      readResult.error?.message ||
      "Existing row पढ़ नहीं पाए"
    );

  }


  const existingRow =
    readResult.values &&
    readResult.values[0]
      ? readResult.values[0]
      : [];


  const existingAWB =
    existingRow[1] !== undefined
      ? String(existingRow[1]).trim()
      : "";


  const newAWB =
    row[1] !== undefined
      ? String(row[1]).trim()
      : "";


  const finalRow = [

    row[0] || "",

    newAWB !== ""
      ? row[1]
      : existingAWB,

    row[2] || "",

    row[3] || "",

    row[4] || "",

    row[5] || "",

    row[6] || "",

    row[7] || "",

    row[8] || ""

  ];


  /* SAVE A:I */

  const rangeAI =
    encodeURIComponent(
      SHEET_NAME +
      "!A" +
      rowToSave +
      ":I" +
      rowToSave
    );


  const urlAI =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    rangeAI +
    "?valueInputOption=USER_ENTERED";


  /* SAVE J:K */

  const rangeJK =
    encodeURIComponent(
      SHEET_NAME +
      "!J" +
      rowToSave +
      ":K" +
      rowToSave
    );


  const urlJK =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    rangeJK +
    "?valueInputOption=RAW";


  /* BOTH SAVE TOGETHER */

  const responseAI =
    fetch(urlAI, {

      method: "PUT",

      headers: {

        "Authorization":
          "Bearer " + accessToken,

        "Content-Type":
          "application/json"

      },

      body: JSON.stringify({

        majorDimension: "ROWS",

        values: [finalRow]

      })

    });


  const responseJK =
    fetch(urlJK, {

      method: "PUT",

      headers: {

        "Authorization":
          "Bearer " + accessToken,

        "Content-Type":
          "application/json"

      },

      body: JSON.stringify({

        majorDimension: "ROWS",

        values: [[
          courier,
          oldCourier
        ]]

      })

    });


  const results =
    await Promise.all([
      responseAI,
      responseJK
    ]);


  const textAI =
    await results[0].text();


  const textJK =
    await results[1].text();


  let resultAI;
  let resultJK;


  try {

    resultAI =
      JSON.parse(textAI);

  }

  catch {

    throw new Error(
      "A:I response invalid है"
    );

  }


  try {

    resultJK =
      JSON.parse(textJK);

  }

  catch {

    throw new Error(
      "J:K response invalid है"
    );

  }


  if (!results[0].ok) {

    throw new Error(
      resultAI.error?.message ||
      "A:I save नहीं हुआ"
    );

  }


  if (!results[1].ok) {

    throw new Error(

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.connect(gain);

    gain.connect(
      audio.destination
    );


    oscillator.frequency.value =
      900;


    gain.gain.value =
      0.2;


    oscillator.start();


    oscillator.stop(
      audio.currentTime + 0.15
    );

  }

}
