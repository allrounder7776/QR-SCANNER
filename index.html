<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>QR Scanner → Google Sheet</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="https://accounts.google.com/gsi/client"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
}

h2 {
  margin-bottom: 15px;
}

#loginBtn {
  padding: 13px 22px;
  font-size: 17px;
  border: none;
  border-radius: 7px;
  background: #4285f4;
  color: white;
  cursor: pointer;
  margin-bottom: 15px;
}

#loginBtn:active {
  transform: scale(0.98);
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: auto;
  background: white;
  border-radius: 8px;
  overflow: hidden;
}

#message {
  margin-top: 20px;
  font-size: 18px;
  font-weight: bold;
  min-height: 45px;
  line-height: 1.5;
}

.success {
  color: green;
}

.error {
  color: red;
}

.info {
  color: #333;
}

</style>

</head>


<body>

<h2>📷 QR Code Scanner</h2>


<button id="loginBtn">
  🔐 Google Account Connect करें
</button>


<div id="reader"></div>


<div id="message" class="info">
  पहले Google Account Connect करें
</div>


<script>


// =====================================================
// GOOGLE SETTINGS
// =====================================================

const CLIENT_ID =
"308840508820-b3qjh155tuj3jl53fqudm2aadk0omm8s.apps.googleusercontent.com";


const SPREADSHEET_ID =
"19CzQLHAihdyNl51W4nzcfzlYGs5V6n1PcOxCWwN-xRg";


const SHEET_NAME =
"Sheet1";


const SHEETS_SCOPE =
"https://www.googleapis.com/auth/spreadsheets";


// =====================================================
// VARIABLES
// =====================================================

let accessToken = null;

let tokenClient = null;

let scanner = null;

let scanning = false;

let saving = false;


// =====================================================
// MESSAGE
// =====================================================

function showMessage(text, type = "info") {

  const box =
    document.getElementById("message");

  box.innerHTML = text;

  box.className = type;

}


// =====================================================
// PAGE LOAD
// =====================================================

window.addEventListener("load", function () {

  // Google library check

  if (
    typeof google === "undefined" ||
    !google.accounts ||
    !google.accounts.oauth2
  ) {

    showMessage(
      "❌ Google Login load नहीं हुआ। Internet check करें।",
      "error"
    );

    return;
  }


  // Google OAuth client

  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id: CLIENT_ID,

      scope: SHEETS_SCOPE,

      callback: function (response) {

        console.log(
          "Google OAuth Response:",
          response
        );


        // Authorization error

        if (response.error) {

          accessToken = null;

          showMessage(
            "❌ Google authorization failed<br>" +
            (response.error_description ||
             response.error),
            "error"
          );

          return;
        }


        // Token received

        if (!response.access_token) {

          showMessage(
            "❌ Google access token नहीं मिला।",
            "error"
          );

          return;
        }


        accessToken =
          response.access_token;


        document.getElementById("loginBtn")
          .style.display = "none";


        showMessage(
          "✅ Google Account Connected<br>📷 अब QR Code Scan करें",
          "success"
        );


        startScanner();

      }

    });

});


// =====================================================
// GOOGLE LOGIN
// =====================================================

document.getElementById("loginBtn")
  .addEventListener("click", function () {

    if (!tokenClient) {

      showMessage(
        "❌ Google Login तैयार नहीं है। Page refresh करें।",
        "error"
      );

      return;
    }


    showMessage(
      "⏳ Google authorization हो रहा है...",
      "info"
    );


    tokenClient.requestAccessToken({
      prompt: ""
    });

  });


// =====================================================
// START SCANNER
// =====================================================

function startScanner() {

  if (scanner) {
    return;
  }


  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width: 280,
      height: 280
    },

    aspectRatio: 1.0

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    onScanFailure

  )

  .then(function () {

    scanning = true;

    showMessage(
      "📷 QR Code Scan करें...",
      "info"
    );

  })

  .catch(function (error) {

    console.error(
      "Camera Error:",
      error
    );


    showMessage(
      "❌ Camera start नहीं हुआ:<br>" +
      error,
      "error"
    );

  });

}


// =====================================================
// QR SCAN SUCCESS
// =====================================================

async function onScanSuccess(decodedText, decodedResult) {

  if (!scanning || saving) {
    return;
  }


  saving = true;

  scanning = false;


  console.log(
    "QR DATA:",
    decodedText
  );


  showMessage(
    "⏳ QR पढ़ लिया गया...<br>Google Sheet में entry हो रही है...",
    "info"
  );


  try {

    // QR data को Sheet row में convert करें

    const row =
      convertQRToRow(decodedText);


    console.log(
      "ROW TO SAVE:",
      row
    );


    // Google Sheets API

    const result =
      await saveToGoogleSheet(row);


    console.log(
      "FINAL SHEETS RESULT:",
      result
    );


    // केवल वास्तविक update के बाद success

    showMessage(
      "✅ Entry Successfully Save हो गई",
      "success"
    );


    beep();


    // अगला scan

    setTimeout(function () {

      saving = false;

      scanning = true;

      showMessage(
        "📷 अगला QR Code Scan करें...",
        "info"
      );

    }, 1500);

  }


  catch (error) {

    console.error(
      "SAVE ERROR:",
      error
    );


    showMessage(
      "❌ Entry Save नहीं हुई<br><br>" +
      error.message,
      "error"
    );


    setTimeout(function () {

      saving = false;

      scanning = true;

      showMessage(
        "📷 फिर से QR Code Scan करें...",
        "info"
      );

    }, 4000);

  }

}


// =====================================================
// QR → SHEET ROW
// =====================================================

function convertQRToRow(qrText) {

  let data = null;


  // ---------------------------------------------------
  // JSON QR try
  // ---------------------------------------------------

  try {

    data =
      JSON.parse(qrText);

  }

  catch (e) {

    data = null;

  }


  // ---------------------------------------------------
  // JSON QR
  // ---------------------------------------------------

  if (
    data &&
    typeof data === "object"
  ) {

    const date =
      data.date ||
      data.DATE ||
      getToday();


    const awb =
      data.awb ||
      data.AWB ||
      data.article ||
      data.articleNo ||
      data.article_no ||
      "";


    const name =
      data.name ||
      data.NAME ||
      "";


    const destination =
      data.destination ||
      data.DESTINATION ||
      "";


    const articleNo =
      data.articleNo ||
      data.article_no ||
      data.article ||
      data.ARTICLE ||
      "";


    const weight =
      data.weight ||
      data.WEIGHT ||
      "";


    const mobile =
      data.mobile ||
      data.mobileNo ||
      data.mobile_no ||
      data.MOBILE ||
      "";


    const order =
      data.order ||
      data.orderNo ||
      data.order_no ||
      data.ORDER ||
      "";


    const live =
      data.live ||
      data.liveNo ||
      data.live_no ||
      data.LIVE ||
      "";


    const courier =
      data.courier ||
      data.COURIER ||
      "";


    return [

      date,

      awb,

      name,

      destination,

      articleNo,

      weight,

      mobile,

      order,

      live,

      courier

    ];

  }


  // ---------------------------------------------------
  // NON JSON QR
  // ---------------------------------------------------

  // अगर QR JSON नहीं है,
  // तो पूरा QR data AWB column में save होगा।

  return [

    getToday(),

    qrText,

    "",

    "",

    "",

    "",

    "",

    "",

    "",

    ""

  ];

}


// =====================================================
// GOOGLE SHEETS API SAVE
// =====================================================

async function saveToGoogleSheet(row) {


  // Token check

  if (!accessToken) {

    throw new Error(
      "Google Account connected नहीं है।"
    );

  }


  // A:J range

  const range =
    encodeURIComponent(
      SHEET_NAME + "!A:J"
    );


  // Google Sheets append API

  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    range +
    ":append" +
    "?valueInputOption=USER_ENTERED" +
    "&insertDataOption=INSERT_ROWS" +
    "&includeValuesInResponse=true";


  console.log(
    "SHEETS API URL:",
    url
  );


  const response =
    await fetch(

      url,

      {

        method: "POST",

        headers: {

          "Authorization":
            "Bearer " + accessToken,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            majorDimension:
              "ROWS",

            values:
              [
                row
              ]

          })

      }

    );


  // Response text

  const text =
    await response.text();


  console.log(
    "RAW API RESPONSE:",
    text
  );


  let result;


  // JSON response

  try {

    result =
      JSON.parse(text);

  }

  catch (e) {

    throw new Error(
      "Google Sheets ने invalid response दिया:<br>" +
      text
    );

  }


  console.log(
    "PARSED API RESPONSE:",
    result
  );


  // API error

  if (!response.ok) {

    // Token expired

    if (
      response.status === 401
    ) {

      accessToken = null;

      document.getElementById("loginBtn")
        .style.display = "inline-block";

    }


    if (
      response.status === 403
    ) {

      throw new Error(
        "Google ने Sheet में लिखने की permission नहीं दी। सुनिश्चित करें कि आपने सही Google Account से Allow किया है और उस account को Sheet का Editor access है।"
      );

    }


    if (
      response.status === 404
    ) {

      throw new Error(
        "Spreadsheet या Sheet1 नहीं मिली। Spreadsheet ID और Sheet name check करें।"
      );

    }


    throw new Error(

      result.error?.message ||

      (
        "Google Sheets API Error: HTTP " +
        response.status
      )

    );

  }


  // ---------------------------------------------------
  // IMPORTANT SUCCESS CHECK
  // ---------------------------------------------------

  if (
    !result.updates
  ) {

    throw new Error(
      "Google Sheets ने update information नहीं दी।"
    );

  }


  const updatedCells =
    Number(
      result.updates.updatedCells || 0
    );


  const updatedRows =
    Number(
      result.updates.updatedRows || 0
    );


  console.log(
    "Updated Cells:",
    updatedCells
  );


  console.log(
    "Updated Rows:",
    updatedRows
  );


  // वास्तविक save verify

  if (
    updatedCells < 1 ||
    updatedRows < 1
  ) {

    throw new Error(
      "Google Sheets में कोई नई row save नहीं हुई।"
    );

  }


  // SUCCESS

  return result;

}


// =====================================================
// TODAY
// =====================================================

function getToday() {

  const now =
    new Date();


  return now.toLocaleDateString(
    "en-GB"
  );

}


// =====================================================
// BEEP
// =====================================================

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.connect(gain);

    gain.connect(
      audio.destination
    );


    oscillator.frequency.value =
      900;


    gain.gain.value =
      0.2;


    oscillator.start();


    oscillator.stop(
      audio.currentTime + 0.15
    );

  }

  catch (e) {

    console.log(
      "Beep error:",
      e
    );

  }

}


// =====================================================
// SCAN FAILURE
// =====================================================

function onScanFailure(error) {

  // Continuous scanner errors ignore करें

}

</script>

</body>

</html>
