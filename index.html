<!DOCTYPE html>

<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>QR Code Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
}

h2 {
  margin-bottom: 15px;
}

#reader {
  width: 100%;
  max-width: 450px;
  margin: auto;
  background: white;
}

#message {
  margin-top: 20px;
  font-size: 18px;
  font-weight: bold;
}

button {
  font-size: 17px;
  padding: 12px 20px;
  margin: 10px;
}

</style>

</head>


<body>

<h2>📷 QR Code Scanner</h2>

<div id="reader"></div>

<div id="message">
  QR Code Scan करें...
</div>


<script>


// ======================================
// यहाँ अपना Apps Script Web App URL डालें
// ======================================

const API_URL =
"https://script.google.com/macros/s/XXXXXXXXXXXX/exec";


// ======================================
// अपना Secret Key डालें
// ======================================

const SECRET_KEY = "QR12345";


let scanning = true;


// ======================================
// QR Scan Successful
// ======================================

function onScanSuccess(decodedText, decodedResult) {

  if (!scanning) return;

  scanning = false;

  document.getElementById("message").innerHTML =
    "⏳ Data Google Sheet में save हो रहा है...";


  // QR data को URL encode करना
  const encodedData =
    encodeURIComponent(decodedText);


  const url =
    API_URL +
    "?key=" +
    encodeURIComponent(SECRET_KEY) +
    "&data=" +
    encodedData;


  // Apps Script को request भेजना

  fetch(url)

    .then(response => response.text())

    .then(result => {

      if (result.includes("SUCCESS")) {

        document.getElementById("message").innerHTML =
          "✅ Entry Successfully Save हो गई";

        // Beep
        beep();

        setTimeout(function() {

          scanning = true;

          document.getElementById("message").innerHTML =
            "📷 अगला QR Code Scan करें...";

        }, 1500);

      }

      else {

        document.getElementById("message").innerHTML =
          "❌ Error: " + result;

        setTimeout(function() {
          scanning = true;
        }, 2500);

      }

    })

    .catch(error => {

      document.getElementById("message").innerHTML =
        "❌ Network Error";

      console.log(error);

      setTimeout(function() {
        scanning = true;
      }, 2500);

    });

}


// ======================================
// QR Scan Failure
// ======================================

function onScanFailure(error) {

  // लगातार scanning के दौरान errors ignore करें

}


// ======================================
// Beep Sound
// ======================================

function beep() {

  try {

    const audioContext =
      new (window.AudioContext ||
           window.webkitAudioContext)();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(audioContext.destination);

    oscillator.frequency.value = 800;

    gain.gain.value = 0.2;

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.15
    );

  }

  catch(e) {

    console.log(e);

  }

}


// ======================================
// Scanner Start
// ======================================

const scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true

    },

    false

  );


scanner.render(
  onScanSuccess,
  onScanFailure
);


</script>

</body>

</html>
