<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>QR Code Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
}

h2 {
  margin-bottom: 20px;
}

#reader {
  width: 100%;
  max-width: 450px;
  margin: auto;
  background: white;
}

#message {
  margin-top: 20px;
  font-size: 20px;
  font-weight: bold;
  min-height: 30px;
}

</style>

</head>


<body>

<h2>📷 QR Code Scanner</h2>

<div id="reader"></div>

<div id="message">
  📷 QR Code Scan करें...
</div>


<script>


// ==================================================
// GOOGLE APPS SCRIPT URL
// ==================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbzXkNtamEPytizcKsj3-fnYwiB4zpN5RtqVxIYH9aD74vOw4nI1p2vieCQPgveNs2uL/exec";


// ==================================================
// SECRET KEY
// ==================================================

const SECRET_KEY = "QR12345";


let scanning = true;

let requestScript = null;

let requestTimeout = null;


// ==================================================
// QR SCANNED
// ==================================================

function onScanSuccess(decodedText, decodedResult) {

  if (!scanning) {
    return;
  }

  scanning = false;


  document.getElementById("message").innerHTML =
    "⏳ Google Sheet में data save हो रहा है...";


  // Unique callback
  const callbackName =
    "qrSave_" + Date.now();


  // ==================================================
  // RESPONSE CALLBACK
  // ==================================================

  window[callbackName] = function(result) {

    // Timeout cancel
    if (requestTimeout) {
      clearTimeout(requestTimeout);
      requestTimeout = null;
    }


    // Script remove
    if (requestScript) {

      requestScript.remove();

      requestScript = null;

    }


    // Callback remove
    delete window[callbackName];


    // ==================================================
    // SUCCESS
    // ==================================================

    if (result === "SUCCESS") {

      document.getElementById("message").innerHTML =
        "✅ Entry Successfully Save हो गई";

      beep();


      // अगला scan
      setTimeout(function() {

        scanning = true;

        document.getElementById("message").innerHTML =
          "📷 अगला QR Code Scan करें...";

      }, 2000);

    }

    else {

      // User को technical error नहीं दिखाएँ
      document.getElementById("message").innerHTML =
        "⚠️ फिर से QR Scan करें";


      setTimeout(function() {

        scanning = true;

        document.getElementById("message").innerHTML =
          "📷 QR Code Scan करें...";

      }, 2000);

    }

  };


  // ==================================================
  // REQUEST URL
  // ==================================================

  const url =
    API_URL +
    "?key=" +
    encodeURIComponent(SECRET_KEY) +
    "&data=" +
    encodeURIComponent(decodedText) +
    "&callback=" +
    encodeURIComponent(callbackName);


  // ==================================================
  // JSONP REQUEST
  // ==================================================

  requestScript =
    document.createElement("script");


  requestScript.src = url;

  requestScript.async = true;


  // Browser/network error
  requestScript.onerror = function() {

    if (requestTimeout) {
      clearTimeout(requestTimeout);
      requestTimeout = null;
    }

    if (requestScript) {
      requestScript.remove();
      requestScript = null;
    }

    delete window[callbackName];


    document.getElementById("message").innerHTML =
      "⚠️ फिर से QR Scan करें";


    setTimeout(function() {

      scanning = true;

      document.getElementById("message").innerHTML =
        "📷 QR Code Scan करें...";

    }, 2000);

  };


  document.body.appendChild(requestScript);


  // ==================================================
  // SAFETY TIMEOUT
  // ==================================================

  requestTimeout = setTimeout(function() {

    if (requestScript) {

      requestScript.remove();

      requestScript = null;

    }

    delete window[callbackName];


    document.getElementById("message").innerHTML =
      "📷 फिर से QR Scan करें";


    scanning = true;

  }, 15000);

}


// ==================================================
// SCAN FAILURE
// ==================================================

function onScanFailure(error) {

  // जानबूझकर कुछ नहीं दिखाएँ

}


// ==================================================
// BEEP
// ==================================================

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const audio =
      new AudioContext();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.connect(gain);

    gain.connect(audio.destination);

    oscillator.frequency.value = 800;

    gain.gain.value = 0.2;

    oscillator.start();

    oscillator.stop(
      audio.currentTime + 0.15
    );

  }

  catch (e) {

    // beep error ignore

  }

}


// ==================================================
// START QR SCANNER
// ==================================================

const scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true

    },

    false

  );


scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>

</html>
