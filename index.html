<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Scanner - Google Sheets</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://accounts.google.com/gsi/client"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 18px;
  background: #f5f5f5;
}

h2 {
  margin-bottom: 15px;
}

button {
  padding: 13px 22px;
  font-size: 17px;
  border: none;
  border-radius: 7px;
  background: #4285f4;
  color: white;
  cursor: pointer;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: 18px auto;
  background: white;
}

#message {
  margin-top: 15px;
  font-size: 18px;
  font-weight: bold;
  line-height: 1.5;
  word-break: break-word;
}

#debug {
  margin: 15px auto;
  max-width: 500px;
  padding: 12px;
  background: #111;
  color: #00ff66;
  text-align: left;
  font-family: monospace;
  font-size: 13px;
  white-space: pre-wrap;
  word-break: break-word;
  border-radius: 6px;
}

.success {
  color: green;
}

.error {
  color: red;
}

.info {
  color: #333;
}

</style>

</head>


<body>

<h2>📷 QR Scanner</h2>

<button id="loginBtn">
🔐 Google Account Connect करें
</button>

<div id="reader"></div>

<div id="message" class="info">
पहले Google Account Connect करें
</div>

<div id="debug">
Diagnostic शुरू नहीं हुआ...
</div>


<script>


// =====================================================
// GOOGLE SETTINGS
// =====================================================

const CLIENT_ID =
"308840508820-b3qjh155tuj3jl53fqudm2aadk0omm8s.apps.googleusercontent.com";


const SPREADSHEET_ID =
"19CzQLHAihdyNl51W4nzcfzlYGs5V6n1PcOxCWwN-xRg";


const SHEET_NAME =
"Sheet1";


const SHEETS_SCOPE =
"https://www.googleapis.com/auth/spreadsheets";


// =====================================================
// VARIABLES
// =====================================================

let accessToken = null;

let tokenClient = null;

let scanner = null;

let scanning = false;

let saving = false;


// =====================================================
// MESSAGE
// =====================================================

function showMessage(text, type) {

  const box =
    document.getElementById("message");

  box.innerHTML = text;

  box.className =
    type || "info";

}


// =====================================================
// DEBUG
// =====================================================

function debug(text) {

  console.log(text);

  const box =
    document.getElementById("debug");

  box.innerText +=
    "\n" + text;

}


// =====================================================
// PAGE LOAD
// =====================================================

window.addEventListener(
  "load",
  function () {

    debug("Page loaded");

    debug(
      "Google library: " +
      (
        typeof google !== "undefined"
          ? "LOADED"
          : "NOT LOADED"
      )
    );


    if (
      typeof google === "undefined" ||
      !google.accounts ||
      !google.accounts.oauth2
    ) {

      showMessage(
        "❌ Google Login library load नहीं हुई",
        "error"
      );

      debug(
        "ERROR: Google OAuth library missing"
      );

      return;
    }


    // ================================================
    // OAuth TOKEN CLIENT
    // ================================================

    tokenClient =
      google.accounts.oauth2.initTokenClient({

        client_id:
          CLIENT_ID,

        scope:
          SHEETS_SCOPE,

        callback:
          handleTokenResponse

      });


    debug(
      "OAuth client initialized"
    );


    showMessage(
      "🔐 Google Account Connect करें",
      "info"
    );

  }
);


// =====================================================
// GOOGLE LOGIN BUTTON
// =====================================================

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    function () {

      if (!tokenClient) {

        showMessage(
          "❌ OAuth अभी तैयार नहीं है",
          "error"
        );

        return;
      }


      debug(
        "Requesting Google access token..."
      );


      showMessage(
        "⏳ Google authorization...",
        "info"
      );


      tokenClient.requestAccessToken({

        prompt: ""

      });

    }
  );


// =====================================================
// TOKEN RESPONSE
// =====================================================

function handleTokenResponse(response) {

  debug(
    "OAuth response received"
  );


  console.log(
    "OAuth Response:",
    response
  );


  if (response.error) {

    accessToken = null;


    showMessage(
      "❌ Google authorization failed<br>" +
      (
        response.error_description ||
        response.error
      ),
      "error"
    );


    debug(
      "OAuth ERROR: " +
      (
        response.error_description ||
        response.error
      )
    );


    return;
  }


  if (!response.access_token) {

    showMessage(
      "❌ Access token नहीं मिला",
      "error"
    );

    debug(
      "ERROR: No access token"
    );

    return;
  }


  accessToken =
    response.access_token;


  debug(
    "Access token received: YES"
  );


  document
    .getElementById("loginBtn")
    .style.display = "none";


  showMessage(
    "✅ Google Account Connected<br>⏳ Sheet access test हो रहा है...",
    "success"
  );


  // पहले Sheet को test करें

  testSheetAccess();

}


// =====================================================
// TEST SHEET ACCESS
// =====================================================

async function testSheetAccess() {

  debug(
    "Testing Spreadsheet access..."
  );


  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID;


  try {

    const response =
      await fetch(

        url,

        {

          method: "GET",

          headers: {

            "Authorization":
              "Bearer " +
              accessToken

          }

        }

      );


    const text =
      await response.text();


    debug(
      "Spreadsheet HTTP: " +
      response.status
    );


    debug(
      "Spreadsheet response: " +
      text.substring(0, 500)
    );


    let result;


    try {

      result =
        JSON.parse(text);

    }

    catch (e) {

      throw new Error(
        "Spreadsheet response JSON नहीं है"
      );

    }


    if (!response.ok) {

      throw new Error(
        result.error?.message ||
        "Spreadsheet access failed"
      );

    }


    debug(
      "Spreadsheet access: OK"
    );


    // Sheet1 check

    const sheets =
      result.sheets || [];


    let found =
      false;


    for (
      let i = 0;
      i < sheets.length;
      i++
    ) {

      const title =
        sheets[i].properties?.title;


      debug(
        "Found sheet: " +
        title
      );


      if (
        title === SHEET_NAME
      ) {

        found = true;

      }

    }


    if (!found) {

      throw new Error(
        "Sheet1 नहीं मिली"
      );

    }


    debug(
      "Sheet1: FOUND"
    );


    showMessage(
      "✅ Google Sheet Connected<br>📷 अब QR Scan करें",
      "success"
    );


    startScanner();

  }


  catch (error) {

    console.error(error);


    showMessage(
      "❌ Sheet access failed<br>" +
      error.message,
      "error"
    );


    debug(
      "SHEET ERROR: " +
      error.message
    );

  }

}


// =====================================================
// START CAMERA
// =====================================================

function startScanner() {

  if (scanner) {

    return;

  }


  debug(
    "Starting camera..."
  );


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: {

      width: 280,

      height: 280

    },

    aspectRatio: 1.0

  };


  scanner
    .start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(
      function () {

        scanning = true;


        debug(
          "Camera started: OK"
        );


        showMessage(
          "📷 QR Code Scan करें...",
          "info"
        );

      }
    )

    .catch(
      function (error) {

        debug(
          "CAMERA ERROR: " +
          error
        );


        showMessage(
          "❌ Camera start नहीं हुआ<br>" +
          error,
          "error"
        );

      }
    );

}


// =====================================================
// QR SUCCESS
// =====================================================

async function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (
    !scanning ||
    saving
  ) {

    return;

  }


  saving = true;

  scanning = false;


  debug(
    "=========================="
  );


  debug(
    "QR SCANNED"
  );


  debug(
    "QR DATA:"
  );


  debug(
    decodedText
  );


  showMessage(
    "⏳ QR पढ़ लिया गया...<br>Google Sheet में save हो रहा है...",
    "info"
  );


  try {

    const row =
      convertQRToRow(
        decodedText
      );


    debug(
      "ROW TO SAVE:"
    );


    debug(
      JSON.stringify(row)
    );


    const result =
      await saveToGoogleSheet(
        row
      );


    debug(
      "API APPEND: SUCCESS"
    );


    debug(
      "Updated Rows: " +
      (
        result.updates?.updatedRows ||
        0
      )
    );


    debug(
      "Updated Cells: " +
      (
        result.updates?.updatedCells ||
        0
      )
    );


    // ================================================
    // FINAL SUCCESS
    // ================================================

    showMessage(
      "✅ Entry Successfully Save हो गई<br>" +
      "Updated Rows: " +
      result.updates.updatedRows,
      "success"
    );


    beep();


    setTimeout(
      function () {

        saving = false;

        scanning = true;


        showMessage(
          "📷 अगला QR Code Scan करें...",
          "info"
        );


      },
      2000
    );

  }


  catch (error) {

    console.error(
      error
    );


    debug(
      "SAVE ERROR:"
    );


    debug(
      error.message
    );


    showMessage(
      "❌ Entry Save नहीं हुई<br><br>" +
      error.message,
      "error"
    );


    setTimeout(
      function () {

        saving = false;

        scanning = true;


        showMessage(
          "📷 फिर से QR Code Scan करें...",
          "info"
        );


      },
      5000
    );

  }

}


// =====================================================
// CONVERT QR DATA
// =====================================================

function convertQRToRow(qrText) {

  let data = null;


  // JSON check

  try {

    data =
      JSON.parse(
        qrText
      );

  }

  catch (e) {

    data = null;

  }


  // ================================================
  // JSON QR
  // ================================================

  if (
    data &&
    typeof data === "object"
  ) {

    return [

      data.date ||
      data.DATE ||
      getToday(),

      data.awb ||
      data.AWB ||
      "",

      data.name ||
      data.NAME ||
      "",

      data.destination ||
      data.DESTINATION ||
      "",

      data.articleNo ||
      data.article_no ||
      data.article ||
      "",

      data.weight ||
      data.WEIGHT ||
      "",

      data.mobile ||
      data.mobileNo ||
      data.mobile_no ||
      "",

      data.order ||
      data.orderNo ||
      data.order_no ||
      "",

      data.live ||
      data.liveNo ||
      data.live_no ||
      "",

      data.courier ||
      data.COURIER ||
      ""

    ];

  }


  // ================================================
  // NON JSON QR
  // ================================================

  return [

    getToday(),

    qrText,

    "",

    "",

    "",

    "",

    "",

    "",

    "",

    ""

  ];

}


// =====================================================
// SAVE TO GOOGLE SHEETS
// =====================================================

async function saveToGoogleSheet(
  row
) {

  if (!accessToken) {

    throw new Error(
      "Access token मौजूद नहीं है"
    );

  }


  debug(
    "Preparing Sheets API append..."
  );


  const range =
    encodeURIComponent(
      SHEET_NAME +
      "!A:J"
    );


  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    range +
    ":append" +

    "?valueInputOption=USER_ENTERED" +

    "&insertDataOption=INSERT_ROWS" +

    "&includeValuesInResponse=true";


  debug(
    "Sending POST request..."
  );


  const response =
    await fetch(

      url,

      {

        method: "POST",

        headers: {

          "Authorization":
            "Bearer " +
            accessToken,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            majorDimension:
              "ROWS",

            values:
              [
                row
              ]

          })

      }

    );


  const text =
    await response.text();


  debug(
    "API HTTP STATUS: " +
    response.status
  );


  debug(
    "API RESPONSE:"
  );


  debug(
    text.substring(
      0,
      1500
    )
  );


  let result;


  try {

    result =
      JSON.parse(
        text
      );

  }

  catch (e) {

    throw new Error(
      "Google API ने invalid response दिया"
    );

  }


  // ================================================
  // API ERROR
  // ================================================

  if (
    !response.ok
  ) {

    if (
      response.status === 401
    ) {

      accessToken = null;

      document
        .getElementById("loginBtn")
        .style.display =
        "inline-block";

    }


    throw new Error(

      result.error?.message ||

      (
        "Google Sheets API Error HTTP " +
        response.status
      )

    );

  }


  // ================================================
  // UPDATE CHECK
  // ================================================

  if (
    !result.updates
  ) {

    throw new Error(
      "API response में updates नहीं मिला"
    );

  }


  const updatedRows =
    Number(
      result.updates.updatedRows ||
      0
    );


  const updatedCells =
    Number(
      result.updates.updatedCells ||
      0
    );


  if (
    updatedRows < 1 ||
    updatedCells < 1
  ) {

    throw new Error(
      "API ने कोई row/cell update नहीं किया"
    );

  }


  return result;

}


// =====================================================
// DATE
// =====================================================

function getToday() {

  return new Date()
    .toLocaleDateString(
      "en-GB"
    );

}


// =====================================================
// BEEP
// =====================================================

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audio.destination
    );


    oscillator.frequency.value =
      900;


    gain.gain.value =
      0.2;


    oscillator.start();


    oscillator.stop(
      audio.currentTime +
      0.15
    );

  }

  catch (e) {

    console.log(e);

  }

}


// =====================================================
// SCAN FAILURE
// =====================================================

function onScanFailure(error) {

  // Continuous scan errors ignore करें

}

</script>

</body>

</html>
