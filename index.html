<!DOCTYPE html>

<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>QR Code Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
}

h2 {
  margin-bottom: 15px;
}

#reader {
  width: 100%;
  max-width: 450px;
  margin: auto;
  background: white;
}

#message {
  margin-top: 20px;
  font-size: 18px;
  font-weight: bold;
}

</style>

</head>


<body>

<h2>📷 QR Code Scanner</h2>

<div id="reader"></div>

<div id="message">
  QR Code Scan करें...
</div>


<!-- Hidden form -->

<form
  id="sendForm"
  method="POST"
  target="hiddenFrame"
  style="display:none;">

  <input
    type="hidden"
    name="key"
    id="keyInput">

  <input
    type="hidden"
    name="data"
    id="dataInput">

</form>


<iframe
  name="hiddenFrame"
  id="hiddenFrame"
  style="display:none;">
</iframe>


<script>


// ========================================
// आपका Google Apps Script Web App URL
// ========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbzXkNtamEPytizcKsj3-fnYwiB4zpN5RtqVxIYH9aD74vOw4nI1p2vieCQPgveNs2uL/exec";


// ========================================
// Secret Key
// ========================================

const SECRET_KEY = "QR12345";


let scanning = true;


// ========================================
// QR Scan Success
// ========================================

function onScanSuccess(decodedText, decodedResult) {

  if (!scanning) return;

  scanning = false;


  document.getElementById("message").innerHTML =
    "⏳ Data Google Sheet में save हो रहा है...";


  // Data form में डालें

  document.getElementById("keyInput").value =
    SECRET_KEY;

  document.getElementById("dataInput").value =
    decodedText;


  // Form को Apps Script पर भेजें

  const form =
    document.getElementById("sendForm");

  form.action = API_URL;

  form.submit();


  // Beep

  beep();


  // थोड़ी देर बाद अगला QR

  setTimeout(function() {

    document.getElementById("message").innerHTML =
      "✅ Entry Successfully Save हो गई";


  }, 1200);


  setTimeout(function() {

    scanning = true;

    document.getElementById("message").innerHTML =
      "📷 अगला QR Code Scan करें...";

  }, 2500);

}


// ========================================
// Scan Failure
// ========================================

function onScanFailure(error) {

  // Scanning के दौरान errors ignore करें

}


// ========================================
// Beep
// ========================================

function beep() {

  try {

    const audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value = 800;

    gain.gain.value = 0.2;


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.15
    );

  }

  catch(e) {

    console.log(e);

  }

}


// ========================================
// Start Scanner
// ========================================

const scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      rememberLastUsedCamera: true

    },

    false

  );


scanner.render(
  onScanSuccess,
  onScanFailure
);


</script>

</body>

</html>
