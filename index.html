<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>QR Scanner → Google Sheet</title>

<!-- QR Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<!-- Google OAuth -->
<script src="https://accounts.google.com/gsi/client"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
}

h2 {
  margin-bottom: 15px;
}

#loginBtn {
  padding: 12px 20px;
  font-size: 17px;
  border: none;
  border-radius: 6px;
  background: #4285f4;
  color: white;
  cursor: pointer;
  margin-bottom: 15px;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: auto;
  background: white;
}

#message {
  margin-top: 20px;
  font-size: 19px;
  font-weight: bold;
  min-height: 40px;
}

.success {
  color: green;
}

.error {
  color: red;
}

.info {
  color: #333;
}

</style>

</head>


<body>

<h2>📷 QR Code Scanner</h2>

<button id="loginBtn">
  🔐 Google Account Connect करें
</button>

<div id="reader"></div>

<div id="message" class="info">
  पहले Google Account Connect करें
</div>


<script>


// =====================================================
// GOOGLE SETTINGS
// =====================================================

const CLIENT_ID =
"308840508820-b3qjh155tuj3jl53fqudm2aadk0omm8s.apps.googleusercontent.com";


const SPREADSHEET_ID =
"19CzQLHAihdyNl51W4nzcfzlYGs5V6n1PcOxCWwN-xRg";


const SHEET_NAME = "Sheet1";


const SHEETS_SCOPE =
"https://www.googleapis.com/auth/spreadsheets";


let accessToken = null;

let tokenClient = null;

let scanner = null;

let scanning = false;

let saving = false;


// =====================================================
// MESSAGE
// =====================================================

function message(text, type = "info") {

  const box =
    document.getElementById("message");

  box.innerHTML = text;

  box.className = type;

}


// =====================================================
// GOOGLE OAUTH INITIALIZE
// =====================================================

window.onload = function () {

  if (
    typeof google === "undefined" ||
    !google.accounts ||
    !google.accounts.oauth2
  ) {

    message(
      "❌ Google Login load नहीं हुआ। Internet check करें।",
      "error"
    );

    return;

  }


  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id: CLIENT_ID,

      scope: SHEETS_SCOPE,

      callback: function (response) {

        if (response.error) {

          console.error(response);

          message(
            "❌ Google authorization failed",
            "error"
          );

          return;
        }


        accessToken =
          response.access_token;


        document.getElementById("loginBtn")
          .style.display = "none";


        message(
          "✅ Google Account Connected<br>📷 अब QR Scan करें",
          "success"
        );


        startScanner();

      }

    });


};


// =====================================================
// GOOGLE LOGIN BUTTON
// =====================================================

document.getElementById("loginBtn")
  .addEventListener("click", function () {

    if (!tokenClient) {

      message(
        "❌ Google Login अभी तैयार नहीं है। Page refresh करें।",
        "error"
      );

      return;

    }


    tokenClient.requestAccessToken({
      prompt: ""
    });

  });


// =====================================================
// START QR SCANNER
// =====================================================

function startScanner() {

  if (scanner) {
    return;
  }


  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width: 280,
      height: 280
    },

    aspectRatio: 1.0

  };


  scanner.start(

    { facingMode: "environment" },

    config,

    onScanSuccess,

    onScanFailure

  )

  .then(function () {

    scanning = true;

    message(
      "📷 QR Code Scan करें...",
      "info"
    );

  })

  .catch(function (error) {

    console.error(error);

    message(
      "❌ Camera start नहीं हुआ: " + error,
      "error"
    );

  });

}


// =====================================================
// QR SUCCESS
// =====================================================

async function onScanSuccess(decodedText, decodedResult) {

  if (!scanning || saving) {
    return;
  }


  saving = true;

  scanning = false;


  message(
    "⏳ QR पढ़ लिया गया... Google Sheet में entry हो रही है...",
    "info"
  );


  try {

    const row =
      convertQRToRow(decodedText);


    console.log("QR DATA:", decodedText);

    console.log("SHEET ROW:", row);


    await saveToGoogleSheet(row);


    message(
      "✅ Entry Successfully Save हो गई",
      "success"
    );


    beep();


    setTimeout(function () {

      saving = false;

      scanning = true;

      message(
        "📷 अगला QR Code Scan करें...",
        "info"
      );

    }, 1500);


  }

  catch (error) {

    console.error(error);


    message(
      "❌ Entry Save नहीं हुई<br>" +
      error.message,
      "error"
    );


    setTimeout(function () {

      saving = false;

      scanning = true;

      message(
        "📷 फिर से QR Code Scan करें...",
        "info"
      );

    }, 3000);

  }

}


// =====================================================
// QR → SHEET ROW
// =====================================================

function convertQRToRow(qrText) {

  let data = null;


  // -----------------------------------------------
  // JSON QR
  // -----------------------------------------------

  try {

    data = JSON.parse(qrText);

  }

  catch (e) {

    data = null;

  }


  // -----------------------------------------------
  // अगर QR JSON है
  // -----------------------------------------------

  if (
    data &&
    typeof data === "object"
  ) {

    return [

      data.date || getToday(),

      data.awb ||
      data.AWB ||
      data.article ||
      data.articleNo ||
      "",

      data.name ||
      data.NAME ||
      "",

      data.destination ||
      data.DESTINATION ||
      "",

      data.articleNo ||
      data.article_no ||
      data.article ||
      "",

      data.weight ||
      data.WEIGHT ||
      "",

      data.mobile ||
      data.mobileNo ||
      data.mobile_no ||
      "",

      data.order ||
      data.orderNo ||
      data.order_no ||
      "",

      data.live ||
      data.liveNo ||
      data.live_no ||
      "",

      data.courier ||
      ""

    ];

  }


  // -----------------------------------------------
  // अगर QR JSON नहीं है
  // -----------------------------------------------

  // पूरा QR text AWB column में जाएगा

  return [

    getToday(),

    qrText,

    "",

    "",

    "",

    "",

    "",

    "",

    "",

    ""

  ];

}


// =====================================================
// SAVE DIRECTLY TO GOOGLE SHEETS API
// =====================================================

async function saveToGoogleSheet(row) {


  if (!accessToken) {

    throw new Error(
      "Google Account connected नहीं है।"
    );

  }


  const range =
    encodeURIComponent(
      SHEET_NAME + "!A:J"
    );


  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    range +
    ":append" +
    "?valueInputOption=USER_ENTERED" +
    "&insertDataOption=INSERT_ROWS";


  const response =
    await fetch(url, {

      method: "POST",

      headers: {

        "Authorization":
          "Bearer " + accessToken,

        "Content-Type":
          "application/json"

      },

      body: JSON.stringify({

        majorDimension: "ROWS",

        values: [
          row
        ]

      })

    });


  const result =
    await response.json();


  if (!response.ok) {

    console.error(
      "Google Sheets API Error:",
      result
    );


    // Token expire हो गया हो
    if (
      response.status === 401 ||
      response.status === 403
    ) {

      accessToken = null;

    }


    throw new Error(
      result.error?.message ||
      "Google Sheets API Error"
    );

  }


  console.log(
    "Google Sheet Response:",
    result
  );


  return result;

}


// =====================================================
// TODAY
// =====================================================

function getToday() {

  const now = new Date();

  return now.toLocaleDateString(
    "en-GB"
  );

}


// =====================================================
// BEEP
// =====================================================

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.connect(gain);

    gain.connect(audio.destination);


    oscillator.frequency.value =
      900;


    gain.gain.value =
      0.2;


    oscillator.start();


    oscillator.stop(
      audio.currentTime + 0.15
    );

  }

  catch (e) {

    console.log(e);

  }

}


// =====================================================
// SCAN FAILURE
// =====================================================

function onScanFailure(error) {

  // Continuous scanning में errors ignore करें

}

</script>

</body>

</html>
