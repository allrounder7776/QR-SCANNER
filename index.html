<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>QR Scanner - Google Sheets</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://accounts.google.com/gsi/client"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 18px;
  background: #f5f5f5;
}

h2 {
  margin-bottom: 15px;
}

button {
  padding: 13px 22px;
  font-size: 17px;
  border: none;
  border-radius: 7px;
  background: #4285f4;
  color: white;
  cursor: pointer;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: 18px auto;
  background: white;
}

#message {
  margin-top: 15px;
  font-size: 18px;
  font-weight: bold;
  line-height: 1.5;
  word-break: break-word;
}

.success {
  color: green;
}

.error {
  color: red;
}

.info {
  color: #333;
}

</style>
</head>

<body>

<h2>📷 QR Scanner</h2>

<button id="loginBtn">
🔐 Google Account Connect करें
</button>

<div id="reader"></div>

<div id="message" class="info">
Google Account check हो रहा है...
</div>

<script>

// =====================================================
// SETTINGS
// =====================================================

const CLIENT_ID =
"308840508820-b3qjh155tuj3jl53fqudm2aadk0omm8s.apps.googleusercontent.com";

const SPREADSHEET_ID =
"19CzQLHAihdyNl51W4nzcfzlYGs5V6n1PcOxCWwN-xRg";

const SHEET_NAME =
"Sheet1";

const PIN_SHEET_NAME =
"PIN CODE";

const SHEETS_SCOPE =
"https://www.googleapis.com/auth/spreadsheets";


// =====================================================
// VARIABLES
// =====================================================

let accessToken = null;
let tokenClient = null;
let scanner = null;

let scanning = false;
let saving = false;

let nextRow = 2;


// =====================================================
// LOGIN MEMORY
// =====================================================

const LOGIN_MEMORY_KEY =
"qr_scanner_google_connected";


// =====================================================
// MESSAGE
// =====================================================

function showMessage(text, type) {

  const box =
    document.getElementById("message");

  box.innerHTML = text;

  box.className =
    type || "info";

}


// =====================================================
// PAGE LOAD
// =====================================================

window.addEventListener(
  "load",
  function() {

    initializeGoogle();

  }
);


// =====================================================
// GOOGLE INITIALIZE
// =====================================================

function initializeGoogle() {

  if (
    typeof google === "undefined" ||
    !google.accounts ||
    !google.accounts.oauth2
  ) {

    showMessage(
      "❌ Google Login load नहीं हुआ",
      "error"
    );

    return;

  }


  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id:
        CLIENT_ID,

      scope:
        SHEETS_SCOPE,

      callback:
        handleTokenResponse

    });


  const remembered =
    localStorage.getItem(
      LOGIN_MEMORY_KEY
    );


  if (
    remembered === "YES"
  ) {

    autoConnect();

  }

  else {

    showMessage(
      "🔐 Google Account Connect करें",
      "info"
    );

  }

}


// =====================================================
// AUTO CONNECT
// =====================================================

function autoConnect() {

  try {

    tokenClient.requestAccessToken({
      prompt: ""
    });

  }

  catch (error) {

    showLoginButton();

  }

}


// =====================================================
// LOGIN BUTTON
// =====================================================

function showLoginButton() {

  document
    .getElementById("loginBtn")
    .style.display =
    "inline-block";


  showMessage(
    "🔐 Google Account Connect करें",
    "info"
  );

}


document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    function() {

      if (!tokenClient) {

        showMessage(
          "❌ Google Login तैयार नहीं है",
          "error"
        );

        return;

      }


      showMessage(
        "⏳ Google authorization...",
        "info"
      );


      tokenClient.requestAccessToken({
        prompt: ""
      });

    }
  );


// =====================================================
// TOKEN RESPONSE
// =====================================================

function handleTokenResponse(response) {

  if (response.error) {

    accessToken = null;

    localStorage.removeItem(
      LOGIN_MEMORY_KEY
    );

    showLoginButton();

    showMessage(
      "❌ Google authorization failed<br>" +
      (
        response.error_description ||
        response.error
      ),
      "error"
    );

    return;

  }


  if (!response.access_token) {

    accessToken = null;

    showLoginButton();

    showMessage(
      "❌ Access token नहीं मिला",
      "error"
    );

    return;

  }


  accessToken =
    response.access_token;


  localStorage.setItem(
    LOGIN_MEMORY_KEY,
    "YES"
  );


  document
    .getElementById("loginBtn")
    .style.display =
    "none";


  testSheetAccess();

}


// =====================================================
// TEST SHEET
// =====================================================

async function testSheetAccess() {

  try {

    const url =
      "https://sheets.googleapis.com/v4/spreadsheets/" +
      SPREADSHEET_ID;


    const response =
      await fetch(
        url,
        {

          headers: {

            "Authorization":
              "Bearer " +
              accessToken

          }

        }
      );


    const text =
      await response.text();


    let result;

    try {

      result =
        JSON.parse(text);

    }

    catch {

      throw new Error(
        "Google Sheet response invalid है"
      );

    }


    if (!response.ok) {

      if (
        response.status === 401 ||
        response.status === 403
      ) {

        accessToken = null;

        localStorage.removeItem(
          LOGIN_MEMORY_KEY
        );

        showLoginButton();

      }


      throw new Error(
        result.error?.message ||
        "Google Sheet access failed"
      );

    }


    const sheets =
      result.sheets || [];


    let mainFound = false;
    let pinFound = false;


    for (
      let i = 0;
      i < sheets.length;
      i++
    ) {

      const title =
        sheets[i].properties?.title;


      if (
        title === SHEET_NAME
      ) {

        mainFound = true;

      }


      if (
        title === PIN_SHEET_NAME
      ) {

        pinFound = true;

      }

    }


    if (!mainFound) {

      throw new Error(
        "Sheet1 नहीं मिली"
      );

    }


    if (!pinFound) {

      throw new Error(
        "PIN CODE sheet नहीं मिली"
      );

    }


    await findNextEntryRow();


    showMessage(
      "✅ Google Account Connected<br>📷 अब QR Scan करें",
      "success"
    );


    startScanner();

  }

  catch (error) {

    showMessage(
      "❌ Sheet access failed<br>" +
      error.message,
      "error"
    );

  }

}


// =====================================================
// FIND NEXT ENTRY ROW
// =====================================================
//
// C = NAME
//
// Row 2 से check होगा.
//
// पहली खाली C row = नई Entry
//
// J Courier को check नहीं किया जाएगा.
//
// =====================================================

async function findNextEntryRow() {

  nextRow = 2;


  const range =
    encodeURIComponent(
      SHEET_NAME + "!C2:C"
    );


  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    range;


  const response =
    await fetch(
      url,
      {

        headers: {

          "Authorization":
            "Bearer " +
            accessToken

        }

      }
    );


  const text =
    await response.text();


  let result;


  try {

    result =
      JSON.parse(text);

  }

  catch {

    throw new Error(
      "Name Column पढ़ने में error"
    );

  }


  if (!response.ok) {

    throw new Error(
      result.error?.message ||
      "Column C पढ़ नहीं पाए"
    );

  }


  const values =
    result.values || [];


  // ===================================================
  // C2 से पहली खाली CELL
  // ===================================================

  for (
    let i = 0;
    i < values.length;
    i++
  ) {

    const name =
      values[i] &&
      values[i][0] !== undefined
        ? String(
            values[i][0]
          ).trim()
        : "";


    if (
      name === ""
    ) {

      nextRow =
        i + 2;

      return;

    }

  }


  // ===================================================
  // अगर सभी rows में Name है
  // ===================================================

  nextRow =
    values.length + 2;

}


// =====================================================
// START CAMERA
// =====================================================

function startScanner() {

  if (scanner) {

    return;

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: {
      width: 280,
      height: 280
    },

    aspectRatio: 1.0

  };


  scanner
    .start(
      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(
      function() {

        scanning = true;


        showMessage(
          "📷 QR Code Scan करें...",
          "info"
        );

      }
    )

    .catch(
      function(error) {

        showMessage(
          "❌ Camera start नहीं हुआ<br>" +
          error,
          "error"
        );

      }
    );

}


// =====================================================
// QR SUCCESS
// =====================================================

async function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (
    !scanning ||
    saving
  ) {

    return;

  }


  saving = true;
  scanning = false;


  showMessage(
    "⏳ QR पढ़ लिया गया...<br>Entry save हो रही है...",
    "info"
  );


  try {

    // =================================================
    // SCAN के समय C फिर से check
    // =================================================

    await findNextEntryRow();


    const rowToSave =
      nextRow;


    // =================================================
    // QR DATA
    // =================================================

    const row =
      convertQRToRow(
        decodedText
      );


    // =================================================
    // D = PIN CODE
    // =================================================

    const pinCode =
      row[3] !== undefined
        ? String(
            row[3]
          ).trim()
        : "";


    // =================================================
    // PIN CODE से COURIER VALUE
    // =================================================

    let courier = "";


    if (
      pinCode !== ""
    ) {

      courier =
        await findCourierByPin(
          pinCode
        );

    }


    // =================================================
    // A:I + J VALUE SAVE
    // =================================================

    await saveEntry(
      row,
      rowToSave,
      courier
    );


    showMessage(
      "✅ Entry Successfully Save हो गई<br>" +
      "Row No: " +
      rowToSave,
      "success"
    );


    beep();


    nextRow =
      rowToSave + 1;


    setTimeout(
      function() {

        saving = false;
        scanning = true;


        showMessage(
          "📷 अगला QR Code Scan करें...",
          "info"
        );

      },
      2000
    );

  }

  catch (error) {

    console.error(error);


    showMessage(
      "❌ Entry Save नहीं हुई<br><br>" +
      error.message,
      "error"
    );


    setTimeout(
      function() {

        saving = false;
        scanning = true;


        showMessage(
          "📷 फिर से QR Code Scan करें...",
          "error"
        );

      },
      5000
    );

  }

}


// =====================================================
// FIND COURIER
// =====================================================
//
// D = PIN CODE
//
// PIN CODE sheet:
//
// Column A = PIN
// Column B = COURIER
//
// यहाँ VLOOKUP FORMULA नहीं लगाया जाता.
//
// केवल VALUE पढ़कर J में save होती है.
//
// =====================================================

async function findCourierByPin(
  pinCode
) {

  const range =
    encodeURIComponent(
      PIN_SHEET_NAME + "!A:B"
    );


  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    range;


  const response =
    await fetch(
      url,
      {

        headers: {

          "Authorization":
            "Bearer " +
            accessToken

        }

      }
    );


  const text =
    await response.text();


  let result;


  try {

    result =
      JSON.parse(text);

  }

  catch {

    throw new Error(
      "PIN CODE data invalid है"
    );

  }


  if (!response.ok) {

    throw new Error(
      result.error?.message ||
      "PIN CODE sheet पढ़ नहीं पाए"
    );

  }


  const values =
    result.values || [];


  const searchPin =
    String(
      pinCode
    ).trim();


  for (
    let i = 0;
    i < values.length;
    i++
  ) {

    const sheetPin =
      values[i] &&
      values[i][0] !== undefined
        ? String(
            values[i][0]
          ).trim()
        : "";


    if (
      sheetPin === searchPin
    ) {

      return (
        values[i][1] !== undefined
          ? String(
              values[i][1]
            ).trim()
          : ""
      );

    }

  }


  return "";

}


// =====================================================
// CONVERT QR
// =====================================================

function convertQRToRow(
  qrText
) {

  let data = null;


  try {

    data =
      JSON.parse(
        qrText
      );

  }

  catch {

    data = null;

  }


  // ===================================================
  // JSON QR
  // ===================================================

  if (
    data &&
    typeof data === "object"
  ) {

    return [

      data.date ||
      data.DATE ||
      getToday(),

      data.awb ||
      data.AWB ||
      "",

      data.name ||
      data.NAME ||
      "",

      data.destination ||
      data.DESTINATION ||
      "",

      data.articleNo ||
      data.article_no ||
      data.article ||
      "",

      data.weight ||
      data.WEIGHT ||
      "",

      data.mobile ||
      data.mobileNo ||
      data.mobile_no ||
      "",

      data.order ||
      data.orderNo ||
      data.order_no ||
      "",

      data.live ||
      data.liveNo ||
      data.live_no ||
      ""

    ];

  }


  // ===================================================
  // NON JSON QR
  // ===================================================

  return [

    getToday(),

    qrText,

    "",

    "",

    "",

    "",

    "",

    "",

    ""

  ];

}


// =====================================================
// SAVE ENTRY
// =====================================================
//
// A:I = QR DATA
//
// J = COURIER VALUE
//
// J में कोई formula नहीं.
//
// =====================================================

async function saveEntry(
  row,
  rowToSave,
  courier
) {

  if (!accessToken) {

    throw new Error(
      "Google Account Connected नहीं है"
    );

  }


  // ===================================================
  // EXISTING A:I READ
  // ===================================================

  const readRange =
    encodeURIComponent(
      SHEET_NAME +
      "!A" +
      rowToSave +
      ":I" +
      rowToSave
    );


  const readUrl =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    readRange;


  const readResponse =
    await fetch(
      readUrl,
      {

        headers: {

          "Authorization":
            "Bearer " +
            accessToken

        }

      }
    );


  const readText =
    await readResponse.text();


  let readResult;


  try {

    readResult =
      JSON.parse(readText);

  }

  catch {

    throw new Error(
      "Existing row पढ़ने में error"
    );

  }


  if (!readResponse.ok) {

    throw new Error(
      readResult.error?.message ||
      "Existing row पढ़ नहीं पाए"
    );

  }


  const existingRow =
    (
      readResult.values &&
      readResult.values[0]
    )
      ? readResult.values[0]
      : [];


  // ===================================================
  // AWB PRESERVE
  // ===================================================

  const existingAWB =
    existingRow[1] !== undefined
      ? String(
          existingRow[1]
        ).trim()
      : "";


  const newAWB =
    row[1] !== undefined
      ? String(
          row[1]
        ).trim()
      : "";


  // ===================================================
  // FINAL A:I
  // ===================================================

  const finalRow = [

    row[0] || "",

    newAWB !== ""
      ? row[1]
      : existingAWB,

    row[2] || "",

    row[3] || "",

    row[4] || "",

    row[5] || "",

    row[6] || "",

    row[7] || "",

    row[8] || ""

  ];


  // ===================================================
  // WRITE A:I
  // ===================================================

  const rangeAI =
    encodeURIComponent(
      SHEET_NAME +
      "!A" +
      rowToSave +
      ":I" +
      rowToSave
    );


  const urlAI =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    rangeAI +
    "?valueInputOption=USER_ENTERED";


  const responseAI =
    await fetch(
      urlAI,
      {

        method: "PUT",

        headers: {

          "Authorization":
            "Bearer " +
            accessToken,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            majorDimension:
              "ROWS",

            values:
              [finalRow]

          })

      }
    );


  const textAI =
    await responseAI.text();


  let resultAI;


  try {

    resultAI =
      JSON.parse(textAI);

  }

  catch {

    throw new Error(
      "Google API response invalid है"
    );

  }


  if (!responseAI.ok) {

    if (
      responseAI.status === 401 ||
      responseAI.status === 403
    ) {

      accessToken = null;

      localStorage.removeItem(
        LOGIN_MEMORY_KEY
      );

      showLoginButton();

    }


    throw new Error(
      resultAI.error?.message ||
      "A:I save नहीं हुआ"
    );

  }


  // ===================================================
  // J = COURIER VALUE
  // ===================================================
  //
  // IMPORTANT:
  //
  // यहाँ कोई VLOOKUP FORMULA नहीं है.
  //
  // सिर्फ Courier का VALUE save होगा.
  //
  // उदाहरण:
  //
  // J2 = DTDC
  //
  // न कि:
  //
  // =VLOOKUP(...)
  //
  // ===================================================

  const rangeJ =
    encodeURIComponent(
      SHEET_NAME +
      "!J" +
      rowToSave
    );


  const urlJ =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    rangeJ +
    "?valueInputOption=RAW";


  const responseJ =
    await fetch(
      urlJ,
      {

        method: "PUT",

        headers: {

          "Authorization":
            "Bearer " +
            accessToken,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            majorDimension:
              "ROWS",

            values:
              [
                [
                  courier
                ]
              ]

          })

      }
    );


  const textJ =
    await responseJ.text();


  let resultJ;


  try {

    resultJ =
      JSON.parse(textJ);

  }

  catch {

    throw new Error(
      "Courier save response invalid है"
    );

  }


  if (!responseJ.ok) {

    if (
      responseJ.status === 401 ||
      responseJ.status === 403
    ) {

      accessToken = null;

      localStorage.removeItem(
        LOGIN_MEMORY_KEY
      );

      showLoginButton();

    }


    throw new Error(
      resultJ.error?.message ||
      "Courier save नहीं हुआ"
    );

  }

}


// =====================================================
// DATE
// =====================================================

function getToday() {

  return new Date()
    .toLocaleDateString(
      "en-GB"
    );

}


// =====================================================
// BEEP
// =====================================================

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audio.destination
    );


    oscillator.frequency.value =
      900;


    gain.gain.value =
      0.2;


    oscillator.start();


    oscillator.stop(
      audio.currentTime +
      0.15
    );

  }

  catch (e) {

    console.log(e);

  }

}


// =====================================================
// SCAN FAILURE
// =====================================================

function onScanFailure(error) {

  // Ignore continuous scan errors

}

</script>

</body>

</html>
