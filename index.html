<script>


/* =====================================================
   GOOGLE SETTINGS
===================================================== */

const CLIENT_ID =
"308840508820-b3qjh155tuj3jl53fqudm2aadk0omm8s.apps.googleusercontent.com";

const SPREADSHEET_ID =
"19CzQLHAihdyNl51W4nzcfzlYGs5V6n1PcOxCWwN-xRg";

const SHEET_NAME =
"Sheet1";

const PIN_SHEET_NAME =
"PIN CODE";

const SCOPES =
"https://www.googleapis.com/auth/spreadsheets";

const LOGIN_MEMORY_KEY =
"qr_scanner_google_connected";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let accessToken = null;

let tokenClient = null;

let scanner = null;

let nextRow = 2;

let saving = false;

let audioContext = null;


/* =====================================================
   PAGE LOAD
===================================================== */

window.onload = function(){

  initializeGoogle();

};


/* =====================================================
   GOOGLE INITIALIZE
===================================================== */

function initializeGoogle(){

  if(
    typeof google === "undefined" ||
    !google.accounts ||
    !google.accounts.oauth2
  ){

    showMessage(
      "Google service load nahi hua. Page refresh karein.",
      "error"
    );

    return;
  }


  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id:CLIENT_ID,

      scope:SCOPES,

      callback:handleTokenResponse

    });


  /*
     Agar pehle connected tha
     to dobara consent popup nahi.
  */

  if(
    localStorage.getItem(
      LOGIN_MEMORY_KEY
    ) === "1"
  ){

    tokenClient.requestAccessToken({

      prompt:""

    });

  }

}


/* =====================================================
   CONNECT GOOGLE
===================================================== */

function connectGoogle(){

  if(!tokenClient){

    showMessage(
      "Google login abhi ready nahi hai.",
      "error"
    );

    return;
  }


  tokenClient.requestAccessToken({

    prompt:"consent"

  });

}


/* =====================================================
   TOKEN RESPONSE
===================================================== */

function handleTokenResponse(response){

  if(response.error){

    showMessage(
      "Google connection failed.",
      "error"
    );

    return;
  }


  accessToken =
    response.access_token;


  localStorage.setItem(
    LOGIN_MEMORY_KEY,
    "1"
  );


  document.getElementById(
    "statusText"
  ).textContent =
    "Google Connected";


  document.getElementById(
    "statusText"
  ).className =
    "status connected";


  document.getElementById(
    "connectBtn"
  ).textContent =
    "Connected";


  prepareAudio();


  testSheetAccess();

}


/* =====================================================
   AUDIO PREPARE
===================================================== */

function prepareAudio(){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if(
      audioContext.state === "suspended"
    ){

      audioContext.resume();

    }

  }catch(e){

    console.log(
      "Audio prepare error:",
      e
    );

  }

}


/* =====================================================
   BEEP
===================================================== */

function beep(){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if(
      audioContext.state === "suspended"
    ){

      audioContext.resume();

    }


    const oscillator =
      audioContext.createOscillator();


    const gainNode =
      audioContext.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      900;


    gainNode.gain.setValueAtTime(
      0.0001,
      audioContext.currentTime
    );


    gainNode.gain.exponentialRampToValueAtTime(
      0.18,
      audioContext.currentTime + 0.01
    );


    gainNode.gain.exponentialRampToValueAtTime(
      0.0001,
      audioContext.currentTime + 0.15
    );


    oscillator.connect(
      gainNode
    );


    gainNode.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.15
    );

  }catch(e){

    console.log(
      "Beep error:",
      e
    );

  }

}


/* =====================================================
   TEST SHEET ACCESS
===================================================== */

async function testSheetAccess(){

  try{

    showMessage(
      "Google Sheet check ho rahi hai...",
      "info"
    );


    const url =
      `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}?fields=sheets.properties`;


    const response =
      await fetch(

        url,

        {

          headers:{
            Authorization:
              "Bearer " + accessToken
          }

        }

      );


    if(!response.ok){

      throw new Error(
        "Google Sheet access denied."
      );

    }


    const data =
      await response.json();


    const sheets =
      data.sheets || [];


    const found =
      sheets.some(

        s =>
          s.properties &&
          s.properties.title === SHEET_NAME

      );


    if(!found){

      throw new Error(
        `"${SHEET_NAME}" sheet nahi mili.`
      );

    }


    /*
       IMPORTANT:
       Next row sirf Column C se.
    */

    nextRow =
      await findNextEntryRow();


    document.getElementById(
      "nextRow"
    ).textContent =
      nextRow;


    showMessage(
      "Ready - QR scan karein.",
      "success"
    );


    startScanner();


  }catch(error){

    console.error(error);


    showMessage(
      error.message,
      "error"
    );

  }

}


/* =====================================================
   FIND NEXT ENTRY ROW
   COLUMN C = NAME
===================================================== */

async function findNextEntryRow(){

  const range =
    encodeURIComponent(
      `${SHEET_NAME}!C2:C`
    );


  const url =
    `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}`;


  const response =
    await fetch(

      url,

      {

        headers:{
          Authorization:
            "Bearer " + accessToken
        }

      }

    );


  if(!response.ok){

    throw new Error(
      "Name column read nahi ho pa raha."
    );

  }


  const data =
    await response.json();


  const values =
    data.values || [];


  /*
     C2 se check.
     Pehla blank = next row.
  */

  for(
    let i = 0;
    i < values.length;
    i++
  ){

    const name =
      values[i] &&
      values[i][0]
        ? String(
            values[i][0]
          ).trim()
        : "";


    if(name === ""){

      return i + 2;

    }

  }


  return values.length + 2;

}


/* =====================================================
   START SCANNER
===================================================== */

async function startScanner(){

  if(scanner){

    try{

      await scanner.stop();

    }catch(e){}


    scanner = null;

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  try{

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {

        fps:10,

        qrbox:{
          width:280,
          height:280
        },

        aspectRatio:1.0

      },

      onScanSuccess,

      onScanFailure

    );


  }catch(error){

    console.error(error);


    showMessage(
      "Camera start nahi ho pa rahi: " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   QR SUCCESS
===================================================== */

async function onScanSuccess(
  decodedText
){

  /*
     Duplicate scan prevent.
  */

  if(saving){

    return;

  }


  saving = true;


  try{

    showMessage(
      "QR mil gaya. Sheet me save ho raha hai...",
      "info"
    );


    /*
       IMPORTANT:
       Har scan ke time Column C dobara check.
    */

    const actualRow =
      await findNextEntryRow();


    nextRow =
      actualRow;


    document.getElementById(
      "nextRow"
    ).textContent =
      actualRow;


    /*
       QR → A:I
    */

    const rowData =
      convertQRToRow(
        decodedText
      );


    /*
       D = PINCODE
    */

    const pinCode =
      rowData[3]
        ? String(
            rowData[3]
          ).trim()
        : "";


    /*
       J:K existing data
    */

    const oldData =
      await readCourierData(
        actualRow
      );


    let oldCourier =
      oldData[0] || "";


    let oldOriginalCourier =
      oldData[1] || "";


    /*
       Existing J ko K me preserve
       agar K blank/#N/A hai.
    */

    if(

      (
        !oldOriginalCourier ||
        oldOriginalCourier === "#N/A"
      )

      &&

      oldCourier

      &&

      oldCourier !== "#N/A"

    ){

      oldOriginalCourier =
        oldCourier;

    }


    /*
       PIN CODE → COURIER
    */

    const currentCourier =
      await findCourierByPin(
        pinCode
      );


    /*
       COMPLETE SAVE
    */

    await saveEntry(

      actualRow,

      rowData,

      currentCourier,

      oldOriginalCourier

    );


    /*
       =================================================
       BEEP YAHAN HAI
       SAVE SUCCESSFUL HONE KE BAAD
       =================================================
    */

    beep();


    /*
       Next row
    */

    nextRow =
      actualRow + 1;


    document.getElementById(
      "nextRow"
    ).textContent =
      nextRow;


    showMessage(
      `Entry successfully saved - Row ${actualRow}`,
      "success"
    );


    /*
       Same QR ki duplicate entry avoid.
    */

    setTimeout(

      () => {

        saving = false;

      },

      700

    );


  }catch(error){

    console.error(error);


    /*
       Error hone par beep NAHI.
    */

    showMessage(
      "Save failed: " +
      error.message,
      "error"
    );


    saving = false;

  }

}


/* =====================================================
   SCAN FAILURE
===================================================== */

function onScanFailure(error){

  /*
     Kuch nahi karna.
     Continuous scanner errors hide.
  */

}


/* =====================================================
   QR → A:I
===================================================== */

function convertQRToRow(
  qrText
){

  let obj = null;


  /*
     JSON try
  */

  try{

    obj =
      JSON.parse(
        qrText
      );

  }catch(e){

    obj = null;

  }


  /*
     Normal text QR
  */

  if(!obj){

    return [

      new Date().toLocaleDateString(
        "en-GB"
      ),

      qrText,

      "",

      "",

      "",

      "",

      "",

      "",

      ""

    ];

  }


  const today =
    new Date().toLocaleDateString(
      "en-GB"
    );


  const date =
    obj.date ??
    obj.Date ??
    today;


  const awb =
    obj.awb ??
    obj.AWB ??
    obj.awbNo ??
    obj.awb_no ??
    "";


  const name =
    obj.name ??
    obj.Name ??
    "";


  const destination =
    obj.destination ??
    obj.Destination ??
    obj.pincode ??
    obj.pinCode ??
    obj.pin ??
    "";


  const articleNo =
    obj.articleNo ??
    obj.article_no ??
    obj.article ??
    obj.Article ??
    "";


  const weight =
    obj.weight ??
    obj.Weight ??
    "";


  const mobile =
    obj.mobile ??
    obj.mobileNo ??
    obj.mobile_no ??
    obj.Mobile ??
    "";


  const order =
    obj.order ??
    obj.orderNo ??
    obj.order_no ??
    obj.Order ??
    "";


  const live =
    obj.live ??
    obj.liveNo ??
    obj.live_no ??
    obj.Live ??
    "";


  return [

    date,

    awb,

    name,

    destination,

    articleNo,

    weight,

    mobile,

    order,

    live

  ];

}


/* =====================================================
   READ J:K
===================================================== */

async function readCourierData(
  rowNumber
){

  const range =
    encodeURIComponent(
      `${SHEET_NAME}!J${rowNumber}:K${rowNumber}`
    );


  const url =
    `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}`;


  const response =
    await fetch(

      url,

      {

        headers:{
          Authorization:
            "Bearer " + accessToken
        }

      }

    );


  if(!response.ok){

    throw new Error(
      "Courier data read nahi ho pa raha."
    );

  }


  const data =
    await response.json();


  return (

    data.values &&
    data.values[0]

  ) || ["",""];

}


/* =====================================================
   PIN → COURIER
===================================================== */

async function findCourierByPin(
  pinCode
){

  if(!pinCode){

    return "#N/A";

  }


  const range =
    encodeURIComponent(
      `${PIN_SHEET_NAME}!A:B`
    );


  const url =
    `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}`;


  const response =
    await fetch(

      url,

      {

        headers:{
          Authorization:
            "Bearer " + accessToken
        }

      }

    );


  if(!response.ok){

    throw new Error(
      "PIN CODE sheet read nahi ho pa rahi."
    );

  }


  const data =
    await response.json();


  const values =
    data.values || [];


  const searchPin =
    String(
      pinCode
    ).trim();


  for(
    let i = 0;
    i < values.length;
    i++
  ){

    const sheetPin =
      values[i][0]
        ? String(
            values[i][0]
          ).trim()
        : "";


    if(
      sheetPin === searchPin
    ){

      const courier =
        values[i][1]
          ? String(
              values[i][1]
            ).trim()
          : "";


      return courier || "#N/A";

    }

  }


  return "#N/A";

}


/* =====================================================
   SAVE ENTRY
===================================================== */

async function saveEntry(

  rowNumber,

  rowData,

  currentCourier,

  oldCourier

){

  /*
     Existing A:I read
  */

  const existingRange =
    encodeURIComponent(
      `${SHEET_NAME}!A${rowNumber}:I${rowNumber}`
    );


  const existingUrl =
    `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${existingRange}`;


  const existingResponse =
    await fetch(

      existingUrl,

      {

        headers:{
          Authorization:
            "Bearer " + accessToken
        }

      }

    );


  if(!existingResponse.ok){

    throw new Error(
      "Existing row read nahi ho pa rahi."
    );

  }


  const existingData =
    await existingResponse.json();


  const existingRow =
    (

      existingData.values &&
      existingData.values[0]

    ) || [];


  /*
     AWB preserve
  */

  if(

    (
      !rowData[1] ||
      String(
        rowData[1]
      ).trim() === ""
    )

    &&

    existingRow[1]

  ){

    rowData[1] =
      existingRow[1];

  }


  /*
     ================================================
     A:I SAVE
     ================================================
  */

  const dataRange =
    encodeURIComponent(
      `${SHEET_NAME}!A${rowNumber}:I${rowNumber}`
    );


  const dataUrl =
    `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${dataRange}?valueInputOption=USER_ENTERED`;


  const dataResponse =
    await fetch(

      dataUrl,

      {

        method:"PUT",

        headers:{

          Authorization:
            "Bearer " + accessToken,

          "Content-Type":
            "application/json"

        },

        body:JSON.stringify({

          range:
            `${SHEET_NAME}!A${rowNumber}:I${rowNumber}`,

          majorDimension:
            "ROWS",

          values:[
            rowData
          ]

        })

      }

    );


  if(!dataResponse.ok){

    const errorText =
      await dataResponse.text();


    throw new Error(
      "A:I save failed - " +
      errorText
    );

  }


  /*
     ================================================
     J:K SAVE
     ================================================
  */

  const courier =
    currentCourier || "#N/A";


  const originalCourier =
    oldCourier || courier;


  const courierRange =
    encodeURIComponent(
      `${SHEET_NAME}!J${rowNumber}:K${rowNumber}`
    );


  const courierUrl =
    `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${courierRange}?valueInputOption=RAW`;


  const courierResponse =
    await fetch(

      courierUrl,

      {

        method:"PUT",

        headers:{

          Authorization:
            "Bearer " + accessToken,

          "Content-Type":
            "application/json"

        },

        body:JSON.stringify({

          range:
            `${SHEET_NAME}!J${rowNumber}:K${rowNumber}`,

          majorDimension:
            "ROWS",

          values:[[

            courier,

            originalCourier

          ]]

        })

      }

    );


  if(!courierResponse.ok){

    const errorText =
      await courierResponse.text();


    throw new Error(
      "J:K save failed - " +
      errorText
    );

  }


  /*

     matlab A:I aur J:K dono successful hain.
