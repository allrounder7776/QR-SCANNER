<!DOCTYPE html>

<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>QR Code Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
}

h2 {
  margin-bottom: 15px;
}

#reader {
  width: 100%;
  max-width: 450px;
  margin: auto;
  background: white;
}

#message {
  margin-top: 20px;
  font-size: 18px;
  font-weight: bold;
}

</style>

</head>


<body>

<h2>📷 QR Code Scanner</h2>

<div id="reader"></div>

<div id="message">
QR Code Scan करें...
</div>


<script>


// ========================================
// Google Apps Script Web App URL
// ========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbzXkNtamEPytizcKsj3-fnYwiB4zpN5RtqVxIYH9aD74vOw4nI1p2vieCQPgveNs2uL/exec";


// ========================================
// Secret Key
// ========================================

const SECRET_KEY = "QR12345";


let scanning = true;
let currentIframe = null;


// ========================================
// QR Scan Success
// ========================================

function onScanSuccess(decodedText, decodedResult) {

  if (!scanning) return;

  scanning = false;


  document.getElementById("message").innerHTML =
    "⏳ Google Sheet में data save हो रहा है...";


  const url =
    API_URL +
    "?key=" +
    encodeURIComponent(SECRET_KEY) +
    "&data=" +
    encodeURIComponent(decodedText);


  // ========================================
  // Hidden iframe
  // ========================================

  const iframe =
    document.createElement("iframe");

  iframe.style.display = "none";

  currentIframe = iframe;

  document.body.appendChild(iframe);


  // ========================================
  // Google Apps Script से message प्राप्त करें
  // ========================================

  window.addEventListener(
    "message",
    handleServerResponse
  );


  // Request भेजें

  iframe.src = url;

}


// ========================================
// Server Response
// ========================================

function handleServerResponse(event) {

  // केवल अपने iframe का response स्वीकार करें

  if (
    !currentIframe ||
    event.source !== currentIframe.contentWindow
  ) {
    return;
  }


  const response = event.data;


  console.log(
    "Google Apps Script Response:",
    response
  );


  // ========================================
  // SUCCESS
  // ========================================

  if (response === "SUCCESS") {

    document.getElementById("message").innerHTML =
      "✅ Entry Successfully Save हो गई";

    beep();

  }


  // ========================================
  // ERROR
  // ========================================

  else if (
    typeof response === "string" &&
    response.startsWith("ERROR:")
  ) {

    document.getElementById("message").innerHTML =
      "❌ Entry Save नहीं हुई<br><small>" +
      response +
      "</small>";

  }


  // ========================================
  // Cleanup
  // ========================================

  setTimeout(function() {

    scanning = true;

    document.getElementById("message").innerHTML =
      "📷 अगला QR Code Scan करें...";


    window.removeEventListener(
      "message",
      handleServerResponse
    );


    if (
      currentIframe &&
      currentIframe.parentNode
    ) {

      currentIframe.parentNode.removeChild(
        currentIframe
      );

    }


    currentIframe = null;

  }, 2500);

}


// ========================================
// Scan Failure
// ========================================

function onScanFailure(error) {

  // Scanning errors ignore करें

}


// ========================================
// Beep
// ========================================

function beep() {

  try {

    const audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value = 800;

    gain.gain.value = 0.2;


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.15
    );

  }

  catch(e) {

    console.log(e);

  }

}


// ========================================
// Start Scanner
// ========================================

const scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true

    },

    false

  );


scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>

</html>
