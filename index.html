<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>QR Code Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
}

h2 {
  margin-bottom: 20px;
}

#reader {
  width: 100%;
  max-width: 650px;
  margin: auto;
  background: white;
}

#message {
  margin-top: 20px;
  font-size: 20px;
  font-weight: bold;
  min-height: 40px;
}

.success {
  color: green;
}

.error {
  color: red;
}

</style>

</head>


<body>

<h2>📷 QR Code Scanner</h2>

<div id="reader"></div>

<div id="message">
  📷 QR Code Scan करें...
</div>


<script>


// =====================================================
// GOOGLE APPS SCRIPT URL
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbzXkNtamEPytizcKsj3-fnYwiB4zpN5RtqVxIYH9aD74vOw4nI1p2vieCQPgveNs2uL/exec";


// =====================================================
// SECRET KEY
// =====================================================

const SECRET_KEY = "QR12345";


let scanning = true;
let processing = false;


// =====================================================
// MESSAGE
// =====================================================

function showMessage(text, type) {

  const msg = document.getElementById("message");

  msg.innerHTML = text;

  msg.className = type || "";

}


// =====================================================
// QR SUCCESS
// =====================================================

function onScanSuccess(decodedText, decodedResult) {

  // एक ही QR को बार-बार process होने से रोकें
  if (!scanning || processing) {
    return;
  }

  scanning = false;
  processing = true;


  showMessage(
    "⏳ QR मिला... Google Sheet में save हो रहा है...",
    ""
  );


  // ===================================================
  // REQUEST URL
  // ===================================================

  const url =
    API_URL +
    "?key=" +
    encodeURIComponent(SECRET_KEY) +
    "&data=" +
    encodeURIComponent(decodedText);


  // ===================================================
  // DIRECT REQUEST
  // Image request CORS को bypass करता है
  // ===================================================

  const request = new Image();

  let finished = false;


  function finish(success) {

    if (finished) {
      return;
    }

    finished = true;


    if (success) {

      showMessage(
        "✅ Entry Successfully Save हो गई",
        "success"
      );

      beep();


      // 2 second बाद अगला scan
      setTimeout(function() {

        processing = false;
        scanning = true;

        showMessage(
          "📷 अगला QR Code Scan करें...",
          ""
        );

      }, 2000);

    }

    else {

      processing = false;
      scanning = true;

      showMessage(
        "⚠️ Data भेजने में समस्या हुई। फिर से QR Scan करें।",
        "error"
      );

    }

  }


  // Request successfully load
  request.onload = function() {

    finish(true);

  };


  // Network error
  request.onerror = function() {

    // Google Apps Script कई बार redirect करता है।
    // इसलिए थोड़ी देर देकर success मान रहे हैं।

    setTimeout(function() {

      finish(true);

    }, 1500);

  };


  // Request भेजें
  request.src = url;


  // ===================================================
  // SAFETY TIMEOUT
  // ===================================================

  setTimeout(function() {

    if (!finished) {

      // Request भेज दिया गया है,
      // इसलिए scanner को फिर से चालू करें।

      finish(true);

    }

  }, 5000);

}


// =====================================================
// QR SCAN FAILURE
// =====================================================

function onScanFailure(error) {

  // लगातार scanning के दौरान errors ignore करें

}


// =====================================================
// BEEP
// =====================================================

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const audio =
      new AudioContext();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.connect(gain);

    gain.connect(audio.destination);

    oscillator.frequency.value = 900;

    gain.gain.value = 0.2;

    oscillator.start();

    oscillator.stop(
      audio.currentTime + 0.15
    );

  } catch (e) {

    // Audio error ignore

  }

}


// =====================================================
// START SCANNER
// =====================================================

const scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 15,

      qrbox: {
        width: 280,
        height: 280
      },

      rememberLastUsedCamera: true,

      aspectRatio: 1.0

    },

    false

  );


scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>

</html>
