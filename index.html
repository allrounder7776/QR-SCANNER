<!DOCTYPE html>

<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Scanner - Google Sheets</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="https://accounts.google.com/gsi/client"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #222;
}

.header {
  background: #1f4e78;
  color: white;
  padding: 18px 15px;
  text-align: center;
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 6px 0 0;
  font-size: 14px;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: 20px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.google-status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.status-text {
  font-weight: bold;
  font-size: 15px;
}

.status-disconnected {
  color: #d93025;
}

.status-connected {
  color: #188038;
}

button {
  border: none;
  border-radius: 9px;
  padding: 11px 16px;
  font-size: 15px;
  cursor: pointer;
}

#connectBtn {
  background: #1a73e8;
  color: white;
}

#connectBtn:disabled {
  background: #aaa;
  cursor: not-allowed;
}

.row-box {
  text-align: center;
}

.row-title {
  font-size: 14px;
  color: #666;
  margin-bottom: 5px;
}

#nextRow {
  font-size: 28px;
  font-weight: bold;
  color: #1f4e78;
}

#reader-wrapper {
  width: 100%;
  max-width: 420px;
  margin: auto;
  position: relative;
}

#reader {
  width: 100%;
}

.scan-frame {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 280px;
  height: 280px;
  transform: translate(-50%, -50%);
  border: 3px solid white;
  border-radius: 12px;
  pointer-events: none;
  box-shadow: 0 0 0 9999px rgba(0,0,0,0.12);
}

.message {
  display: none;
  padding: 12px;
  border-radius: 9px;
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
}

.message.success {
  display: block;
  background: #e6f4ea;
  color: #137333;
}

.message.error {
  display: block;
  background: #fce8e6;
  color: #c5221f;
}

.message.info {
  display: block;
  background: #e8f0fe;
  color: #174ea6;
}

.hint {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-top: 12px;
}

@media (max-width: 500px) {
  .header h1 {
    font-size: 21px;
  }

  .scan-frame {
    width: 240px;
    height: 240px;
  }
}
</style>

</head>

<body>

<div class="header">
  <h1>QR Scanner</h1>
  <p>QR Scan → Google Sheets</p>
</div>

<div class="container">

  <div class="card">
    <div class="google-status">

```
  <div>
    <div class="status-text status-disconnected" id="googleStatus">
      Google Not Connected
    </div>
  </div>

  <button id="connectBtn" onclick="connectGoogle()">
    Connect Google
  </button>

</div>
```

  </div>

  <div class="card row-box">

```
<div class="row-title">
  Next Entry Row
</div>

<div id="nextRow">
  --
</div>
```

  </div>

  <div class="card">

```
<div id="reader-wrapper">

  <div id="reader"></div>

  <div class="scan-frame"></div>

</div>

<div id="messageBox" class="message"></div>

<div class="hint">
  QR Code को सफेद बॉक्स के अंदर रखें
</div>
```

  </div>

</div>

<script>

/* =========================================================
   GOOGLE SETTINGS
   ========================================================= */

/*
   आपका दिया हुआ EXACT Client ID
*/

const CLIENT_ID =
"308840508820-b3qjh155tuj3jl53fqudm2aadk0omm8s.apps.googleusercontent.com";

const SPREADSHEET_ID =
"19CzQLHAihdyNl51W4nzcfzlYGs5V6n1PcOxCWwN-xRg";

const SHEET_NAME = "Sheet1";

const PIN_SHEET_NAME = "PIN CODE";

const SCOPES =
"https://www.googleapis.com/auth/spreadsheets";

const LOGIN_MEMORY_KEY =
"qr_scanner_google_connected";


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let tokenClient = null;

let accessToken = null;

let scanner = null;

let scanInProgress = false;


/* =========================================================
   PAGE LOAD
   ========================================================= */

window.onload = function () {

  initializeGoogle();

};


/* =========================================================
   GOOGLE INITIALIZATION
   ========================================================= */

function initializeGoogle() {

  if (
    !window.google ||
    !google.accounts ||
    !google.accounts.oauth2
  ) {

    showMessage(
      "Google service load नहीं हुआ। Page को refresh करें।",
      "error"
    );

    return;
  }


  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id: CLIENT_ID,

      scope: SCOPES,

      callback: handleTokenResponse

    });


  /*
    अगर पहले Google connect किया जा चुका है,
    तो दोबारा consent screen दिखाने की कोशिश नहीं होगी।
  */

  if (
    localStorage.getItem(LOGIN_MEMORY_KEY) === "1"
  ) {

    tokenClient.requestAccessToken({
      prompt: ""
    });

  }

}


/* =========================================================
   CONNECT GOOGLE
   ========================================================= */

function connectGoogle() {

  if (!tokenClient) {

    showMessage(
      "Google अभी तैयार नहीं है। Page refresh करें।",
      "error"
    );

    return;
  }


  tokenClient.requestAccessToken({
    prompt: "consent"
  });

}


/* =========================================================
   GOOGLE TOKEN RESPONSE
   ========================================================= */

function handleTokenResponse(response) {

  if (response.error) {

    console.error(response);

    showMessage(
      "Google connection failed: " +
      response.error,
      "error"
    );

    return;
  }


  accessToken = response.access_token;


  localStorage.setItem(
    LOGIN_MEMORY_KEY,
    "1"
  );


  const status =
    document.getElementById("googleStatus");

  status.textContent =
    "Google Connected";

  status.classList.remove(
    "status-disconnected"
  );

  status.classList.add(
    "status-connected"
  );


  const btn =
    document.getElementById("connectBtn");

  btn.textContent =
    "Google Connected";

  btn.disabled = true;


  testSheetAccess();

}


/* =========================================================
   TEST GOOGLE SHEET ACCESS
   ========================================================= */

async function testSheetAccess() {

  try {

    showMessage(
      "Google Sheet check हो रही है...",
      "info"
    );


    const url =
      `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}?fields=sheets.properties`;


    const response =
      await fetch(url, {

        method: "GET",

        headers: {
          Authorization:
            "Bearer " + accessToken
        }

      });


    const data =
      await response.json();


    if (!response.ok) {

      console.error(data);

      throw new Error(
        data.error?.message ||
        "Google Sheet access failed"
      );

    }


    const sheetExists =
      data.sheets?.some(
        sheet =>
          sheet.properties?.title === SHEET_NAME
      );


    if (!sheetExists) {

      throw new Error(
        `"${SHEET_NAME}" sheet नहीं मिली।`
      );

    }


    const nextRow =
      await findNextEntryRow();


    document.getElementById("nextRow")
      .textContent = nextRow;


    showMessage(
      "Google Sheet Connected Successfully",
      "success"
    );


    startScanner();

  } catch (error) {

    console.error(error);

    showMessage(
      "Google Sheet Error: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   FIND NEXT ENTRY ROW
   COLUMN C = NAME
   START FROM ROW 2
   ========================================================= */

async function findNextEntryRow() {

  const range =
    `${SHEET_NAME}!C2:C`;


  const url =
    `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}`;


  const response =
    await fetch(url, {

      method: "GET",

      headers: {
        Authorization:
          "Bearer " + accessToken
      }

    });


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(
      data.error?.message ||
      "Name column read नहीं हो सका"
    );

  }


  const values =
    data.values || [];


  /*
    Row 2 से check होगा।

    Column C में पहला खाली cell मिले तो
    वही next entry row होगी।

    अगर कोई खाली row नहीं है तो
    last checked row के बाद वाली row होगी।
  */

  for (
    let i = 0;
    i < values.length;
    i++
  ) {

    const value =
      values[i]?.[0];

    if (
      value === undefined ||
      value === null ||
      String(value).trim() === ""
    ) {

      return i + 2;

    }

  }


  return values.length + 2;

}


/* =========================================================
   START QR SCANNER
   ========================================================= */

function startScanner() {

  if (scanner) {

    return;

  }


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: {
        exact: "environment"
      }
    },

    {
      fps: 10,

      qrbox: {
        width: 280,
        height: 280
      }

    },

    onScanSuccess,

    onScanError

  ).catch(error => {

    console.error(error);

    /*
      कुछ phones में exact environment camera
      available नहीं होता।
    */

    startScannerFallback();

  });

}


/* =========================================================
   CAMERA FALLBACK
   ========================================================= */

function startScannerFallback() {

  if (!scanner) {

    scanner =
      new Html5Qrcode("reader");

  }


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 280,
        height: 280
      }

    },

    onScanSuccess,

    onScanError

  ).catch(error => {

    console.error(error);

    showMessage(
      "Camera start नहीं हो पाया। Chrome में Camera Permission check करें।",
      "error"
    );

  });

}


/* =========================================================
   QR SCAN ERROR
   ========================================================= */

function onScanError(errorMessage) {

  /*
    जानबूझकर यहाँ कोई diagnostic box/message नहीं है।
  */

}


/* =========================================================
   QR SUCCESS
   ========================================================= */

async function onScanSuccess(decodedText) {

  /*
    एक ही QR बार-बार save न हो।
  */

  if (scanInProgress) {

    return;

  }


  scanInProgress = true;


  try {

    showMessage(
      "QR मिला। Data save हो रहा है...",
      "info"
    );


    /*
      Save करने से ठीक पहले फिर से
      Column C check किया जाता है।
    */

    const actualRow =
      await findNextEntryRow();


    document.getElementById("nextRow")
      .textContent = actualRow;


    /*
      QR data को A:I में convert करना
    */

    const rowData =
      convertQRToRow(decodedText);


    /*
      PIN Code Column D है।
    */

    const pinCode =
      rowData[3];


    /*
      Existing Courier data पढ़ना
      ताकि पुराना original courier सुरक्षित रहे।
    */

    const oldCourierData =
      await readCourierData(actualRow);


    let oldCourier =
      oldCourierData?.[0] || "";

    let originalCourier =
      oldCourierData?.[1] || "";


    /*
      अगर K खाली है या #N/A है,
      तो पुराना Courier J से लिया जाएगा।
    */

    if (
      !originalCourier ||
      originalCourier === "#N/A"
    ) {

      originalCourier =
        oldCourier || "";

    }


    /*
      PIN CODE sheet से Courier खोजना
    */

    let courier =
      await findCourierByPin(pinCode);


    /*
      अगर lookup से courier नहीं मिला,
      तो #N/A रहेगा।
    */

    if (!courier) {

      courier = "#N/A";

    }


    /*
      A:I + J:K save
    */

    await saveEntry(
      actualRow,
      rowData,
      courier,
      originalCourier
    );


    /*
      Success beep
    */

    playSuccessBeep();


    showMessage(
      `Entry successfully save हुई — Row ${actualRow}`,
      "success"
    );


    /*
      अगली available row
    */

    const nextRow =
      await findNextEntryRow();


    document.getElementById("nextRow")
      .textContent = nextRow;


  } catch (error) {

    console.error(error);

    showMessage(
      "Entry save नहीं हुई: " +
      error.message,
      "error"
    );

  } finally {

    /*
      थोड़ा delay ताकि वही QR दोबारा
      तुरंत scan न हो।
    */

    setTimeout(() => {

      scanInProgress = false;

    }, 1500);

  }

}


/* =========================================================
   QR DATA → A:I
   ========================================================= */

function convertQRToRow(qrText) {

  let data = null;


  /*
    पहले JSON QR check
  */

  try {

    data = JSON.parse(qrText);

  } catch (error) {

    data = null;

  }


  /*
    अगर QR JSON है
  */

  if (
    data &&
    typeof data === "object"
  ) {

    const today =
      new Date().toLocaleDateString(
        "en-IN"
      );


    return [

      data.date ||
      data.Date ||
      today,

      data.awb ||
      data.AWB ||
      data.awbNo ||
      data.tracking ||
      "",

      data.name ||
      data.Name ||
      "",

      data.destination ||
      data.pincode ||
      data.pin ||
      data.PINCODE ||
      "",

      data.articleNo ||
      data.article ||
      data.ArticleNo ||
      "",

      data.weight ||
      data.Weight ||
      "",

      data.mobile ||
      data.Mobile ||
      data.phone ||
      "",

      data.order ||
      data.Order ||
      data.orderId ||
      "",

      data.live ||
      data.Live ||
      ""

    ];

  }


  /*
    अगर QR JSON नहीं है,
    तो QR text को AWB के रूप में रखा जाएगा।
  */

  return [

    new Date().toLocaleDateString(
      "en-IN"
    ),

    qrText,

    "",

    "",

    "",

    "",

    "",

    "",

    ""

  ];

}


/* =========================================================
   READ EXISTING J:K
   ========================================================= */

async function readCourierData(rowNumber) {

  const range =
    `${SHEET_NAME}!J${rowNumber}:K${rowNumber}`;


  const url =
    `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}`;


  const response =
    await fetch(url, {

      method: "GET",

      headers: {
        Authorization:
          "Bearer " + accessToken
      }

    });


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(
      data.error?.message ||
      "Courier data read नहीं हो सका"
    );

  }


  return data.values?.[0] || [];

}


/* =========================================================
   FIND COURIER BY PIN
   PIN CODE!A:B
   ========================================================= */

async function findCourierByPin(pinCode) {

  if (
    pinCode === undefined ||
    pinCode === null ||
    String(pinCode).trim() === ""
  ) {

    return "#N/A";

  }


  const range =
    `'${PIN_SHEET_NAME}'!A:B`;


  const url =
    `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}`;


  const response =
    await fetch(url, {

      method: "GET",

      headers: {
        Authorization:
          "Bearer " + accessToken
      }

    });


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(
      data.error?.message ||
      "PIN CODE sheet read नहीं हो सकी"
    );

  }


  const values =
    data.values || [];


  const searchPin =
    String(pinCode).trim();


  for (
    let i = 0;
    i < values.length;
    i++
  ) {

    const sheetPin =
      values[i]?.[0];


    if (
      sheetPin !== undefined &&
      String(sheetPin).trim() === searchPin
    ) {

      return (
        values[i]?.[1] ||
        "#N/A"
      );

    }

  }


  return "#N/A";

}


/* =========================================================
   SAVE ENTRY
   ========================================================= */

async function saveEntry(
  rowNumber,
  rowData,
  courier,
  originalCourier
) {

  /*
    Existing A:I data read करें।
    इससे blank AWB होने पर पुराना AWB
    सुरक्षित रखा जा सकता है।
  */

  const existingRange =
    `${SHEET_NAME}!A${rowNumber}:I${rowNumber}`;


  const existingUrl =
    `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(existingRange)}`;


  const existingResponse =
    await fetch(existingUrl, {

      method: "GET",

      headers: {
        Authorization:
          "Bearer " + accessToken
      }

    });


  const existingData =
    await existingResponse.json();


  if (!existingResponse.ok) {

    throw new Error(
      existingData.error?.message ||
      "Existing row read नहीं हो सकी"
    );

  }


  const existingRow =
    existingData.values?.[0] || [];


  /*
    अगर नया AWB खाली है तो existing AWB preserve होगा।
  */

  if (
    !rowData[1] &&
    existingRow[1]
  ) {

    rowData[1] =
      existingRow[1];

  }


  /* =======================================================
     A:I SAVE
     ======================================================= */

  const dataRange =
    `${SHEET_NAME}!A${rowNumber}:I${rowNumber}`;


  const dataUrl =
    `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(dataRange)}?valueInputOption=USER_ENTERED`;


  const dataResponse =
    await fetch(dataUrl, {

      method: "PUT",

      headers: {

        Authorization:
          "Bearer " + accessToken,

        "Content-Type":
          "application/json"

      },

      body: JSON.stringify({

        range: dataRange,

        majorDimension: "ROWS",

        values: [rowData]

      })

    });


  const dataResult =
    await dataResponse.json();


  if (!dataResponse.ok) {

    throw new Error(
      dataResult.error?.message ||
      "A:I data save नहीं हुआ"
    );

  }


  /* =======================================================
     J:K SAVE
     ======================================================= */

  const courierRange =
    `${SHEET_NAME}!J${rowNumber}:K${rowNumber}`;


  const courierUrl =
    `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(courierRange)}?valueInputOption=RAW`;


  const courierResponse =
    await fetch(courierUrl, {

      method: "PUT",

      headers: {

        Authorization:
          "Bearer " + accessToken,

        "Content-Type":
          "application/json"

      },

      body: JSON.stringify({

        range: courierRange,

        majorDimension: "ROWS",

        values: [[
          courier,
          originalCourier
        ]]

      })

    });


  const courierResult =
    await courierResponse.json();


  if (!courierResponse.ok) {

    throw new Error(
      courierResult.error?.message ||
      "Courier data save नहीं हुआ"
    );

  }

}


/* =========================================================
   SUCCESS BEEP
   ========================================================= */

function playSuccessBeep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {

      return;

    }


    const audioContext =
      new AudioContext();


    const oscillator =
      audioContext.createOscillator();


    const gainNode =
      audioContext.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      1000;


    gainNode.gain.value =
      0.15;


    oscillator.connect(
      gainNode
    );


    gainNode.connect(
      audioContext.destination
    );


    oscillator.start();


    setTimeout(() => {

      oscillator.stop();

      audioContext.close();

    }, 180);

  } catch (error) {

    console.log(
      "Beep unavailable"
    );

  }

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      "messageBox"
    );


  box.textContent =
    text;


  box.className =
    "message " + type;

}


/* =========================================================
   PREVENT DOUBLE CLICK ZOOM
   ========================================================= */

let lastTouchEnd = 0;


document.addEventListener(
  "touchend",
  function(event) {

    const now =
      Date.now();


    if (
      now - lastTouchEnd <= 300
    ) {

      event.preventDefault();

    }


    lastTouchEnd = now;

  },
  false
);

</script>

</body>
</html>
