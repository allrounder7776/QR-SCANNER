<body>

<h2>📷 QR Scanner</h2>

<button id="loginBtn">
🔐 Google Account Connect करें
</button>

<div id="reader"></div>

<div id="message" class="info">
Google Account check हो रहा है...
</div>


<script>

// =====================================================
// GOOGLE SETTINGS
// =====================================================

const CLIENT_ID =
"308840508820-b3qjh155tuj3jl53fqudm2aadk0omm8s.apps.googleusercontent.com";

const SPREADSHEET_ID =
"19CzQLHAihdyNl51W4nzcfzlYGs5V6n1PcOxCWwN-xRg";

const SHEET_NAME =
"Sheet1";

const SHEETS_SCOPE =
"https://www.googleapis.com/auth/spreadsheets";


// =====================================================
// VARIABLES
// =====================================================

let accessToken = null;

let tokenClient = null;

let scanner = null;

let scanning = false;

let saving = false;

let nextRow = nextrow;


// =====================================================
// LOGIN MEMORY
// =====================================================

const LOGIN_MEMORY_KEY =
"qr_scanner_google_connected";


// =====================================================
// MESSAGE
// =====================================================

function showMessage(text, type) {

  const box =
    document.getElementById("message");

  box.innerHTML = text;

  box.className =
    type || "info";

}


// =====================================================
// PAGE LOAD
// =====================================================

window.addEventListener(
  "load",
  function () {

    initializeGoogle();

  }
);


// =====================================================
// GOOGLE INITIALIZE
// =====================================================

function initializeGoogle() {

  if (
    typeof google === "undefined" ||
    !google.accounts ||
    !google.accounts.oauth2
  ) {

    showMessage(
      "❌ Google Login library load नहीं हुई",
      "error"
    );

    return;

  }


  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id:
        CLIENT_ID,

      scope:
        SHEETS_SCOPE,

      callback:
        handleTokenResponse

    });


  const remembered =
    localStorage.getItem(
      LOGIN_MEMORY_KEY
    );


  if (
    remembered === "YES"
  ) {

    showMessage(
      "🔄 Google Account automatically connect हो रहा है...",
      "info"
    );

    autoConnect();

  }

  else {

    showMessage(
      "🔐 Google Account Connect करें",
      "info"
    );

  }

}


// =====================================================
// AUTO CONNECT
// =====================================================

function autoConnect() {

  try {

    tokenClient.requestAccessToken({

      prompt: ""

    });

  }

  catch (error) {

    showLoginButton();

  }

}


// =====================================================
// SHOW LOGIN
// =====================================================

function showLoginButton() {

  document
    .getElementById("loginBtn")
    .style.display =
    "inline-block";


  showMessage(
    "🔐 Google Account Connect करें",
    "info"
  );

}


// =====================================================
// LOGIN BUTTON
// =====================================================

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    function () {

      if (!tokenClient) {

        showMessage(
          "❌ Google Login अभी तैयार नहीं है",
          "error"
        );

        return;

      }


      showMessage(
        "⏳ Google authorization...",
        "info"
      );


      tokenClient.requestAccessToken({

        prompt: ""

      });

    }
  );


// =====================================================
// TOKEN RESPONSE
// =====================================================

function handleTokenResponse(response) {

  if (response.error) {

    accessToken = null;

    localStorage.removeItem(
      LOGIN_MEMORY_KEY
    );

    showLoginButton();

    showMessage(
      "❌ Google authorization failed<br>" +
      (
        response.error_description ||
        response.error
      ),
      "error"
    );

    return;

  }


  if (!response.access_token) {

    accessToken = null;

    showLoginButton();

    showMessage(
      "❌ Access token नहीं मिला",
      "error"
    );

    return;

  }


  accessToken =
    response.access_token;


  localStorage.setItem(
    LOGIN_MEMORY_KEY,
    "YES"
  );


  document
    .getElementById("loginBtn")
    .style.display =
    "none";


  showMessage(
    "✅ Google Account Connected<br>⏳ Sheet check हो रही है...",
    "success"
  );


  testSheetAccess();

}


// =====================================================
// TEST SHEET ACCESS
// =====================================================

async function testSheetAccess() {

  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID;


  try {

    const response =
      await fetch(
        url,
        {

          method: "GET",

          headers: {

            "Authorization":
              "Bearer " +
              accessToken

          }

        }
      );


    const text =
      await response.text();


    let result;


    try {

      result =
        JSON.parse(text);

    }

    catch (e) {

      throw new Error(
        "Spreadsheet response JSON नहीं है"
      );

    }


    if (!response.ok) {

      if (
        response.status === 401 ||
        response.status === 403
      ) {

        accessToken = null;

        localStorage.removeItem(
          LOGIN_MEMORY_KEY
        );

      }


      throw new Error(
        result.error?.message ||
        "Spreadsheet access failed"
      );

    }


    const sheets =
      result.sheets || [];


    let found = false;


    for (
      let i = 0;
      i < sheets.length;
      i++
    ) {

      if (
        sheets[i].properties?.title ===
        SHEET_NAME
      ) {

        found = true;

        break;

      }

    }


    if (!found) {

      throw new Error(
        "Sheet1 नहीं मिली"
      );

    }


    // Row 2 से पहली खाली Name Row
    await findNextEmptyRow();


    showMessage(
      "✅ Google Account Connected<br>📷 अब QR Scan करें",
      "success"
    );


    startScanner();

  }


  catch (error) {

    showMessage(
      "❌ Sheet access failed<br>" +
      error.message,
      "error"
    );


    if (!accessToken) {

      showLoginButton();

    }

  }

}


// =====================================================
// CLEAN NAME VALUE
// =====================================================
//
// यह function इन सभी को EMPTY मानेगा:
//
// ""
// " "
// "   "
// non-breaking space
// zero-width space
// formula से आया blank
//
// =====================================================

function cleanNameValue(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(/\u00A0/g, "")

    .replace(/\u200B/g, "")

    .replace(/\u200C/g, "")

    .replace(/\u200D/g, "")

    .trim();

}


// =====================================================
// FIND NEXT ENTRY ROW
// =====================================================
//
// IMPORTANT:
//
// केवल Column C = Name.
//
// हमेशा C2 से शुरू.
//
// पहली EMPTY C cell = Entry Row.
//
// J Courier का कोई relation नहीं.
//
// =====================================================

async function findNextEmptyRow() {

  // ===================================================
  // HARD RESET
  // ===================================================

  nextRow = 2;


  // ===================================================
  // IMPORTANT:
  // C2:C1000 पढ़ेंगे
  //
  // C2 खाली होने पर भी result में C2 की
  // position maintain होगी.
  // ===================================================

  const range =
    encodeURIComponent(
      SHEET_NAME + "!C2:C1000"
    );


  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    range +
    "?majorDimension=COLUMNS" +
    "&valueRenderOption=FORMATTED_VALUE";


  const response =
    await fetch(
      url,
      {

        method: "GET",

        headers: {

          "Authorization":
            "Bearer " +
            accessToken

        }

      }
    );


  const text =
    await response.text();


  let result;


  try {

    result =
      JSON.parse(text);

  }

  catch (e) {

    throw new Error(
      "Column C response JSON नहीं है"
    );

  }


  if (!response.ok) {

    throw new Error(
      result.error?.message ||
      "Column C पढ़ नहीं पाए"
    );

  }


  // ===================================================
  // COLUMN C VALUES
  // ===================================================

  const columnValues =
    (
      result.values &&
      result.values[0]
    )
      ? result.values[0]
      : [];


  // ===================================================
  // ALWAYS START FROM ROW 2
  // ===================================================

  nextRow = 2;


  // ===================================================
  // C2 → C1000
  // ===================================================

  for (
    let i = 0;
    i < 999;
    i++
  ) {

    const value =
      columnValues[i] !== undefined
        ? columnValues[i]
        : "";


    const name =
      cleanNameValue(
        value
      );


    // =================================================
    // FIRST EMPTY NAME
    // =================================================

    if (
      name === ""
    ) {

      nextRow =
        i + 2;

      return;

    }

  }


  // ===================================================
  // अगर C2:C1000 तक सब भरा है
  // ===================================================

  nextRow = 1001;

}


// =====================================================
// START CAMERA
// =====================================================

function startScanner() {

  if (scanner) {

    return;

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: {

      width: 280,

      height: 280

    },

    aspectRatio: 1.0

  };


  scanner
    .start(
      {

        facingMode:
          "environment"

      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(
      function () {

        scanning = true;


        showMessage(
          "📷 QR Code Scan करें...",
          "info"
        );

      }
    )

    .catch(
      function (error) {

        showMessage(
          "❌ Camera start नहीं हुआ<br>" +
          error,
          "error"
        );

      }
    );

}


// =====================================================
// QR SUCCESS
// =====================================================

async function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (
    !scanning ||
    saving
  ) {

    return;

  }


  saving = true;

  scanning = false;


  showMessage(
    "⏳ QR पढ़ लिया गया...<br>Google Sheet में save हो रहा है...",
    "info"
  );


  try {

    // =================================================
    // VERY IMPORTANT
    //
    // QR scan के ठीक बाद Column C फिर से पढ़ेंगे.
    // इसलिए पुराना nextRow इस्तेमाल नहीं होगा.
    // =================================================

    await findNextEmptyRow();


    // =================================================
    // ROW NUMBER LOCK
    // =================================================

    const rowToSave =
      nextRow;


    const row =
      convertQRToRow(
        decodedText
      );


    await saveToGoogleSheet(
      row,
      rowToSave
    );


    showMessage(
      "✅ Entry Successfully Save हो गई<br>" +
      "Row No: " +
      rowToSave +
      "<br>🚚 Courier भी update हो गया",
      "success"
    );


    beep();


    // अगली scan पर फिर Column C check होगा
    nextRow =
      rowToSave + 1;


    setTimeout(
      function () {

        saving = false;

        scanning = true;


        showMessage(
          "📷 अगला QR Code Scan करें...",
          "info"
        );

      },
      2000
    );

  }


  catch (error) {

    console.error(error);


    showMessage(
      "❌ Entry Save नहीं हुई<br><br>" +
      error.message,
      "error"
    );


    setTimeout(
      function () {

        saving = false;

        scanning = true;


        showMessage(
          "📷 फिर से QR Code Scan करें...",
          "error"
        );

      },
      5000
    );

  }

}


// =====================================================
// CONVERT QR DATA
// =====================================================

function convertQRToRow(qrText) {

  let data = null;


  try {

    data =
      JSON.parse(
        qrText
      );

  }

  catch (e) {

    data = null;

  }


  // ===================================================
  // JSON QR
  // ===================================================

  if (
    data &&
    typeof data === "object"
  ) {

    return [

      data.date ||
      data.DATE ||
      getToday(),

      data.awb ||
      data.AWB ||
      "",

      data.name ||
      data.NAME ||
      "",

      data.destination ||
      data.DESTINATION ||
      "",

      data.articleNo ||
      data.article_no ||
      data.article ||
      "",

      data.weight ||
      data.WEIGHT ||
      "",

      data.mobile ||
      data.mobileNo ||
      data.mobile_no ||
      "",

      data.order ||
      data.orderNo ||
      data.order_no ||
      "",

      data.live ||
      data.liveNo ||
      data.live_no ||
      ""

    ];

  }


  // ===================================================
  // NON JSON QR
  // ===================================================

  return [

    getToday(),

    qrText,

    "",

    "",

    "",

    "",

    "",

    "",

    ""

  ];

}


// =====================================================
// SAVE TO GOOGLE SHEETS
// =====================================================

async function saveToGoogleSheet(
  row,
  rowToSave
) {

  if (!accessToken) {

    throw new Error(
      "Google Account Connected नहीं है"
    );

  }


  // ===================================================
  // EXISTING ROW READ
  // ===================================================

  const readRange =
    encodeURIComponent(
      SHEET_NAME +
      "!A" +
      rowToSave +
      ":I" +
      rowToSave
    );


  const readUrl =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    readRange;


  const readResponse =
    await fetch(
      readUrl,
      {

        method: "GET",

        headers: {

          "Authorization":
            "Bearer " +
            accessToken

        }

      }
    );


  const readText =
    await readResponse.text();


  let readResult;


  try {

    readResult =
      JSON.parse(readText);

  }

  catch (e) {

    throw new Error(
      "Existing row पढ़ने में error आया"
    );

  }


  if (!readResponse.ok) {

    throw new Error(
      readResult.error?.message ||
      "Existing row पढ़ नहीं पाए"
    );

  }


  const existingRow =
    (
      readResult.values &&
      readResult.values[0]
    )
      ? readResult.values[0]
      : [];


  // ===================================================
  // EXISTING AWB
  // ===================================================

  const existingAWB =
    existingRow[1] !== undefined
      ? String(
          existingRow[1]
        ).trim()
      : "";


  const newAWB =
    row[1] !== undefined
      ? String(
          row[1]
        ).trim()
      : "";


  // ===================================================
  // FINAL A:I
  // ===================================================

  const finalRow = [

    row[0] !== undefined
      ? row[0]
      : "",

    newAWB !== ""
      ? row[1]
      : existingAWB,

    row[2] !== undefined
      ? row[2]
      : "",

    row[3] !== undefined
      ? row[3]
      : "",

    row[4] !== undefined
      ? row[4]
      : "",

    row[5] !== undefined
      ? row[5]
      : "",

    row[6] !== undefined
      ? row[6]
      : "",

    row[7] !== undefined
      ? row[7]
      : "",

    row[8] !== undefined
      ? row[8]
      : ""

  ];


  // ===================================================
  // WRITE A:I
  // ===================================================

  const rangeAI =
    encodeURIComponent(
      SHEET_NAME +
      "!A" +
      rowToSave +
      ":I" +
      rowToSave
    );


  const urlAI =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    rangeAI +
    "?valueInputOption=USER_ENTERED";


  const responseAI =
    await fetch(
      urlAI,
      {

        method: "PUT",

        headers: {

          "Authorization":
            "Bearer " +
            accessToken,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            majorDimension:
              "ROWS",

            values:
              [finalRow]

          })

      }
    );


  const textAI =
    await responseAI.text();


  let resultAI;


  try {

    resultAI =
      JSON.parse(textAI);

  }

  catch (e) {

    throw new Error(
      "Google API response invalid है"
    );

  }


  if (!responseAI.ok) {

    if (
      responseAI.status === 401
    ) {

      accessToken = null;

      localStorage.removeItem(
        LOGIN_MEMORY_KEY
      );

      showLoginButton();

    }


    throw new Error(

      resultAI.error?.message ||

      (
        "Google Sheets API Error HTTP " +
        responseAI.status
      )

    );

  }


  // ===================================================
  // COURIER = COLUMN J
  // ===================================================

  const courierFormula =
    "=IFERROR(VLOOKUP(D" +
    rowToSave +
    ",'PIN CODE'!A:B,2,FALSE),\"\")";


  const rangeJ =
    encodeURIComponent(
      SHEET_NAME +
      "!J" +
      rowToSave
    );


  const urlJ =
    "https://sheets.googleapis.com/v4/spreadsheets/" +
    SPREADSHEET_ID +
    "/values/" +
    rangeJ +
    "?valueInputOption=USER_ENTERED";


  const responseJ =
    await fetch(
      urlJ,
      {

        method: "PUT",

        headers: {

          "Authorization":
            "Bearer " +
            accessToken,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            majorDimension:
              "ROWS",

            values:
              [
                [
                  courierFormula
                ]
              ]

          })

      }
    );


  const textJ =
    await responseJ.text();


  let resultJ;


  try {

    resultJ =
      JSON.parse(textJ);

  }

  catch (e) {

    throw new Error(
      "Courier formula response invalid है"
    );

  }


  if (!responseJ.ok) {

    if (
      responseJ.status === 401
    ) {

      accessToken = null;

      localStorage.removeItem(
        LOGIN_MEMORY_KEY
      );


      document
        .getElementById("loginBtn")
        .style.display =
        "inline-block";

    }


    throw new Error(

      resultJ.error?.message ||

      (
        "Courier formula save error HTTP " +
        responseJ.status
      )

    );

  }

}


// =====================================================
// DATE
// =====================================================

function getToday() {

  return new Date()
    .toLocaleDateString(
      "en-GB"
    );

}


// =====================================================
// BEEP
// =====================================================

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audio.destination
    );


    oscillator.frequency.value =
      900;


    gain.gain.value =
      0.2;


    oscillator.start();


    oscillator.stop(
      audio.currentTime +
      0.15
    );

  }

  catch (e) {

    console.log(e);

  }

}


// =====================================================
// SCAN FAILURE
// =====================================================

function onScanFailure(error) {

  // Continuous scan errors ignore करें

}

</script>
