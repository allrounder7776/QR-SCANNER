<!DOCTYPE html>

<head>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;

  font-family:Arial, sans-serif;

}

.container{

  max-width:520px;

  border-radius:22px;
  padding:22px;
  box-shadow:0 12px 40px rgba(0,0,0,.12);
}

h1{
  margin:0;

.subtitle{
  text-align:center;

#connectBtn{

/* html5-qrcode ka default visual scan box hide */

  outline:none !important;
  box-shadow:none !important;
}

  display:none !important;

<body>

<div class="container">

  <h1>QR Scanner</h1>

  <div class="subtitle">
    QR scan karke Google Sheet me entry karein
  </div>

  <button id="connectBtn">
    Connect Google Sheet
  </button>

  <div id="status">
    Google Sheet se connect karein
  </div>

  <div class="scanner-box">

    <div id="reader"></div>

    <!-- Sirf ye custom scan corners dikhengi -->
    <div class="scan-overlay">
      <div class="scan-frame">

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="scan-line"></div>

      </div>
    </div>

  </div>

  <div id="message" class="message"></div>

  <div class="row-info">
    Next entry row: <span id="nextRow">-</span>
  </div>

</div>

<script>

/* ================================
   GOOGLE SETTINGS
================================ */

const CLIENT_ID =
"308840508820-b3qjh155tuj3jl53fqudm2aadk0omm8s.apps.googleusercontent.com";

const SPREADSHEET_ID =
"19CzQLHAihdyNl51W4nzcfzlYGs5V6n1PcOxCWwN-xRg";

const SHEET_NAME = "Sheet1";
const PIN_SHEET_NAME = "PIN CODE";

const SCOPES =
"https://www.googleapis.com/auth/spreadsheets";

const LOGIN_MEMORY_KEY =
"qr_scanner_google_connected";


/* ================================
   VARIABLES
================================ */

let tokenClient;
let accessToken = null;
let html5QrCode = null;

let nextRow = 2;
let saving = false;


/* ================================
   ELEMENTS
================================ */

const connectBtn =
document.getElementById("connectBtn");

const statusBox =
document.getElementById("status");

const messageBox =
document.getElementById("message");

const nextRowBox =
document.getElementById("nextRow");


/* ================================
   INITIALIZE GOOGLE
================================ */

function initializeGoogle(){

  tokenClient = google.accounts.oauth2.initTokenClient({

    client_id: CLIENT_ID,

    scope: SCOPES,

    callback: handleTokenResponse

  });

  connectBtn.addEventListener("click", function(){

    if(!tokenClient){
      statusBox.textContent =
      "Google service load nahi hua.";
      return;
    }

    tokenClient.requestAccessToken({
      prompt: ""
    });

  });


  /* Auto reconnect */

  if(localStorage.getItem(LOGIN_MEMORY_KEY) === "1"){

    setTimeout(function(){

      tokenClient.requestAccessToken({
        prompt: ""
      });

    },500);

  }

}


/* ================================
   GOOGLE TOKEN RESPONSE
================================ */

async function handleTokenResponse(response){

  if(response.error){

    statusBox.textContent =
    "Google connection failed.";

    connectBtn.textContent =
    "Connect Google Sheet";

    connectBtn.classList.remove("connected");

    return;
  }


  accessToken = response.access_token;

  localStorage.setItem(
    LOGIN_MEMORY_KEY,
    "1"
  );


  connectBtn.textContent =
  "✓ Google Sheet Connected";

  connectBtn.classList.add("connected");

  statusBox.textContent =
  "Google Sheet connected successfully.";


  try{

    await testSheetAccess();

  }catch(error){

    console.error(error);

    statusBox.textContent =
    "Sheet access error: " + error.message;

  }

}


/* ================================
   API REQUEST
================================ */

async function googleRequest(url, options = {}){

  if(!accessToken){
    throw new Error(
      "Google account connected nahi hai."
    );
  }


  const headers = {

    "Authorization":
    "Bearer " + accessToken,

    "Content-Type":
    "application/json",

    ...(options.headers || {})

  };


  const response =
  await fetch(url, {

    ...options,

    headers

  });


  if(!response.ok){

    let errorText = "";

    try{

      const errorData =
      await response.json();

      errorText =
      errorData.error?.message ||
      JSON.stringify(errorData);

    }catch(e){

      errorText =
      await response.text();

    }

    throw new Error(errorText);

  }


  return response.json();

}


/* ================================
   TEST SHEET
================================ */

async function testSheetAccess(){

  const url =
  `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}?fields=sheets.properties.title`;


  const data =
  await googleRequest(url);


  const sheets =
  data.sheets || [];


  const sheetExists =
  sheets.some(

    s =>
    s.properties &&
    s.properties.title === SHEET_NAME

  );


  const pinSheetExists =
  sheets.some(

    s =>
    s.properties &&
    s.properties.title === PIN_SHEET_NAME

  );


  if(!sheetExists){

    throw new Error(
      `"${SHEET_NAME}" sheet nahi mili.`
    );

  }


  if(!pinSheetExists){

    throw new Error(
      `"${PIN_SHEET_NAME}" sheet nahi mili.`
    );

  }


  await findNextEntryRow();

  statusBox.textContent =
  "Ready — QR scan karein.";

  startScanner();

}


/* ================================
   FIND NEXT ROW
   BASED ONLY ON COLUMN C
================================ */

async function findNextEntryRow(){

  const range =
  encodeURIComponent(
    `${SHEET_NAME}!C2:C`
  );


  const url =
  `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}`;


  const data =
  await googleRequest(url);


  const values =
  data.values || [];


  let foundRow = null;


  for(let i = 0; i < values.length; i++){

    const value =
    values[i] &&
    values[i][0] !== undefined
    ? String(values[i][0]).trim()
    : "";


    if(value === ""){

      foundRow = i + 2;

      break;

    }

  }


  if(foundRow === null){

    foundRow =
    values.length + 2;

  }


  nextRow = foundRow;

  nextRowBox.textContent =
  nextRow;

  return nextRow;

}


/* ================================
   START SCANNER
================================ */

function startScanner(){

  if(html5QrCode){
    return;
  }


  html5QrCode =
  new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width:280,
      height:280
    },

    aspectRatio:1.0

  };


  html5QrCode.start(

    {
      facingMode:"environment"
    },

    config,

    onScanSuccess,

    onScanFailure

  )

  .then(function(){

    statusBox.textContent =
    "Camera ready — QR code scan karein.";

  })

  .catch(function(error){

    console.error(error);

    statusBox.textContent =
    "Camera start nahi ho paya. Camera permission check karein.";

  });

}


/* ================================
   SCAN SUCCESS
================================ */

async function onScanSuccess(decodedText){

  if(saving){
    return;
  }


  saving = true;


  /* Beep immediately */

  beep();


  try{

    statusBox.textContent =
    "QR scan ho gaya. Saving...";


    /*
      IMPORTANT:
      Save se pehle dobara Column C check.
      Isse wrong row / 462 / 531 wali problem nahi hogi.
    */

    const actualRow =
    await findNextEntryRow();


    const rowData =
    convertQRToRow(decodedText);


    const pinCode =
    rowData[3] ?
    String(rowData[3]).trim() :
    "";


    /* Existing J/K data */

    const existingCourier =
    await readCourierData(actualRow);


    let oldCourier =
    existingCourier.oldCourier;


    let currentCourier =
    existingCourier.courier;


    /*
      Agar K me pehle se courier hai
      to usko preserve karein.
    */

    if(
      (
        oldCourier === "" ||
        oldCourier === "#N/A"
      ) &&
      currentCourier &&
      currentCourier !== "#N/A"
    ){

      oldCourier =
      currentCourier;

    }


    /*
      PIN CODE sheet se courier lookup
    */

    const foundCourier =
    await findCourierByPin(pinCode);


    if(foundCourier){

      currentCourier =
      foundCourier;

    }else{

      currentCourier =
      "#N/A";

    }


    /*
      Save A:I + J:K
    */

    await saveEntry(

      actualRow,

      rowData,

      currentCourier,

      oldCourier

    );


    /* Update next row */

    nextRow =
    actualRow + 1;

    nextRowBox.textContent =
    nextRow;


    showMessage(

      `Entry successfully save — Row ${actualRow}`,

      "success"

    );


    statusBox.textContent =
    "QR scan karein.";

  }

  catch(error){

    console.error(error);


    showMessage(

      "Entry save nahi hui: " +
      error.message,

      "error"

    );


    statusBox.textContent =
    "Save error.";

  }


  finally{

    saving = false;

  }

}


/* ================================
   READ J:K
================================ */

async function readCourierData(rowNumber){

  const range =
  encodeURIComponent(
    `${SHEET_NAME}!J${rowNumber}:K${rowNumber}`
  );


  const url =
  `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}`;


  const data =
  await googleRequest(url);


  const row =
  data.values &&
  data.values[0]
  ? data.values[0]
  : [];


  return {

    courier:
    row[0] !== undefined
    ? String(row[0]).trim()
    : "",

    oldCourier:
    row[1] !== undefined
    ? String(row[1]).trim()
    : ""

  };

}


/* ================================
   FIND COURIER BY PIN
================================ */

async function findCourierByPin(pinCode){

  if(!pinCode){
    return null;
  }


  const range =
  encodeURIComponent(
    `${PIN_SHEET_NAME}!A:B`
  );


  const url =
  `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}`;


  const data =
  await googleRequest(url);


  const values =
  data.values || [];


  const searchPin =
  String(pinCode).trim();


  for(let i = 0; i < values.length; i++){

    const row =
    values[i] || [];


    const sheetPin =
    row[0] !== undefined
    ? String(row[0]).trim()
    : "";


    if(sheetPin === searchPin){

      const courier =
      row[1] !== undefined
      ? String(row[1]).trim()
      : "";


      if(courier){

        return courier;

      }

    }

  }


  return null;

}


/* ================================
   QR → A:I
================================ */

function convertQRToRow(qrText){

  const today =
  new Date().toLocaleDateString(
    "en-GB"
  );


  /*
    JSON QR
  */

  try{

    const obj =
    JSON.parse(qrText);


    const date =
    obj.date ??
    obj.Date ??
    today;


    const awb =
    obj.awb ??
    obj.AWB ??
    obj.awbNo ??
    obj.awb_no ??
    "";


    const name =
    obj.name ??
    obj.Name ??
    "";


    const destination =
    obj.destination ??
    obj.Destination ??
    obj.pincode ??
    obj.pinCode ??
    obj.pin ??
    "";


    const articleNo =
    obj.articleNo ??
    obj.article_no ??
    obj.article ??
    obj.Article ??
    "";


    const weight =
    obj.weight ??
    obj.Weight ??
    "";


    const mobile =
    obj.mobile ??
    obj.mobileNo ??
    obj.mobile_no ??
    obj.Mobile ??
    "";


    const order =
    obj.order ??
    obj.orderNo ??
    obj.order_no ??
    obj.Order ??
    "";


    const live =
    obj.live ??
    obj.liveNo ??
    obj.live_no ??
    obj.Live ??
    "";


    return [

      date,
      awb,
      name,
      destination,
      articleNo,
      weight,
      mobile,
      order,
      live

    ];

  }

  catch(error){

    /*
      Agar QR JSON nahi hai
      to complete QR text B column me save hoga.
    */

    return [

      today,
      qrText,
      "",
      "",
      "",
      "",
      "",
      "",
      ""

    ];

  }

}


/* ================================
   SAVE ENTRY
================================ */

async function saveEntry(

  rowNumber,

  rowData,

  courier,

  oldCourier

){

  /*
    Existing A:I read karein
    taki important existing AWB overwrite na ho.
  */

  const existingRange =
  encodeURIComponent(
    `${SHEET_NAME}!A${rowNumber}:I${rowNumber}`
  );


  const existingUrl =
  `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${existingRange}`;


  const existingData =
  await googleRequest(existingUrl);


  const existingRow =
  existingData.values &&
  existingData.values[0]
  ? existingData.values[0]
  : [];


  /*
    Existing AWB preserve
    agar new QR me AWB blank ho.
  */

  if(

    (
      rowData[1] === "" ||
      rowData[1] === null ||
      rowData[1] === undefined
    ) &&

    existingRow[1] !== undefined &&

    String(existingRow[1]).trim() !== ""

  ){

    rowData[1] =
    existingRow[1];

  }


  /*
    A:I save
  */

  const rangeAI =
  `${SHEET_NAME}!A${rowNumber}:I${rowNumber}`;


  const urlAI =
  `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(rangeAI)}?valueInputOption=USER_ENTERED`;


  await googleRequest(

    urlAI,

    {

      method:"PUT",

      body:JSON.stringify({

        range:rangeAI,

        majorDimension:"ROWS",

        values:[
          rowData
        ]

      })

    }

  );


  /*
    J:K save
  */

  const rangeJK =
  `${SHEET_NAME}!J${rowNumber}:K${rowNumber}`;


  const urlJK =
  `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(rangeJK)}?valueInputOption=RAW`;


  await googleRequest(

    urlJK,

    {

      method:"PUT",

      body:JSON.stringify({

        range:rangeJK,

        majorDimension:"ROWS",

        values:[

          [
            courier || "#N/A",
            oldCourier || ""

          ]

        ]

      })

    }

  );

}


/* ================================
   MESSAGE
================================ */

function showMessage(text,type){

  messageBox.textContent =
  text;

  messageBox.className =
  "message " + type;


  setTimeout(function(){

    messageBox.className =
    "message";

  },4000);

}


/* ================================
   BEEP
================================ */

function beep(){

  try{

    const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;


    if(!AudioContext){
      return;
    }


    const audioContext =
    new AudioContext();


    const oscillator =
    audioContext.createOscillator();


    const gain =
    audioContext.createGain();


    oscillator.frequency.value =
    900;


    oscillator.type =
    "sine";


    gain.gain.value =
    0.15;


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    setTimeout(function(){

      oscillator.stop();

      audioContext.close();

    },150);

  }

  catch(error){

    console.log(
      "Beep error:",
      error
    );

  }

}


/* ================================
   SCAN FAILURE
================================ */

function onScanFailure(error){

  /*
    Intentionally blank.
    Har failed scan par message nahi dikhayega.
  */

}


/* ================================
   GOOGLE INITIALIZATION
================================ */

window.addEventListener(
  "load",
  function(){

    if(
      typeof google !== "undefined" &&
      google.accounts &&
      google.accounts.oauth2
    ){

      initializeGoogle();

    }else{

      statusBox.textContent =
      "Google service load nahi hui.";

    }

  }
);

</script>

</body>
</html>
