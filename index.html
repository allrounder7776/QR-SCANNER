  </div>

<script>

/* =========================================================
   GOOGLE / SHEET SETTINGS
   ========================================================= */

const CLIENT_ID =
"308840508820-b3qjh155tuj3jl53fqudm2aadk0omm8s.apps.googleusercontent.com";

const SPREADSHEET_ID =
"19CzQLHAihdyNl51W4nzcfzlYGs5V6n1PcOxCWwN-xRg";

const SHEET_NAME = "Sheet1";
const PIN_SHEET_NAME = "PIN CODE";

const SCOPES =
"https://www.googleapis.com/auth/spreadsheets";

const LOGIN_MEMORY_KEY =
"qr_scanner_google_connected";


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let tokenClient = null;
let accessToken = null;

let scanner = null;

let scanning = false;
let saving = false;

let nextRow = 2;

let audioContext = null;


/* =========================================================
   UI HELPERS
   ========================================================= */

function setStatus(text, type="") {

  document.getElementById("statusText").textContent = text;

  const dot = document.getElementById("statusDot");

  dot.className = "status-dot";

  if(type){
    dot.classList.add(type);
  }
}


function setSystemStatus(text){
  document.getElementById("systemStatus").textContent = text;
}


function setRowStatus(row){
  document.getElementById("rowStatus").textContent =
    row ? row : "—";
}


function setScannerStatus(text){
  document.getElementById("scannerStatus").textContent = text;
}


/* =========================================================
   GOOGLE INITIALIZATION
   ========================================================= */

function initializeGoogle(){

  if(!window.google || !google.accounts){
    setStatus("Google service load nahi hua", "error");
    return;
  }

  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id: CLIENT_ID,

      scope: SCOPES,

      callback: handleTokenResponse

    });


  const remembered =
    localStorage.getItem(LOGIN_MEMORY_KEY) === "1";

  if(remembered){

    setStatus("Google account reconnect ho raha hai...");

    tokenClient.requestAccessToken({
      prompt:""
    });

  }else{

    setStatus("Google account connect karein");

  }
}


/* =========================================================
   GOOGLE CONNECT BUTTON
   ========================================================= */

function connectGoogle(){

  if(!tokenClient){
    initializeGoogle();
    return;
  }

  tokenClient.requestAccessToken({
    prompt:"consent"
  });
}


/* =========================================================
   GOOGLE TOKEN RESPONSE
   ========================================================= */

async function handleTokenResponse(response){

  if(response.error){

    console.error(response);

    setStatus("Google connection failed", "error");

    setSystemStatus("Error");

    return;
  }


  accessToken = response.access_token;

  localStorage.setItem(
    LOGIN_MEMORY_KEY,
    "1"
  );


  const btn =
    document.getElementById("connectBtn");

  btn.textContent = "✓ Google Connected";
  btn.classList.add("connected");


  setStatus("Google connected. Sheet check ho rahi hai...");

  setSystemStatus("Connected");


  await prepareAudio();


  await testSheetAccess();
}


/* =========================================================
   TEST SHEET ACCESS
   ========================================================= */

async function testSheetAccess(){

  try{

    const url =
      "https://sheets.googleapis.com/v4/spreadsheets/"
      + encodeURIComponent(SPREADSHEET_ID)
      + "?fields=sheets.properties";

    const response =
      await fetch(url,{
        headers:{
          Authorization:
            "Bearer " + accessToken
        }
      });


    if(!response.ok){

      const text =
        await response.text();

      throw new Error(text);
    }


    const data =
      await response.json();


    const sheets =
      (data.sheets || [])
      .map(s => s.properties.title);


    if(!sheets.includes(SHEET_NAME)){
      throw new Error(
        SHEET_NAME + " sheet nahi mili"
      );
    }


    if(!sheets.includes(PIN_SHEET_NAME)){
      throw new Error(
        PIN_SHEET_NAME + " sheet nahi mili"
      );
    }


    await findNextEntryRow();


    setStatus(
      "Scanner ready — QR code scan karein",
      "ready"
    );

    setSystemStatus("Ready");

    startScanner();

  }catch(error){

    console.error(error);

    setStatus(
      "Google Sheet access nahi ho raha",
      "error"
    );

    setSystemStatus("Error");

    stopScanner();

    alert(
      "Google Sheet access error:\n\n"
      + error.message
    );
  }
}


/* =========================================================
   FIND NEXT ROW
   IMPORTANT:
   ROW IS ALWAYS BASED ON COLUMN C
   ========================================================= */

async function findNextEntryRow(){

  const range =
    SHEET_NAME + "!C2:C";


  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/"
    + encodeURIComponent(SPREADSHEET_ID)
    + "/values/"
    + encodeURIComponent(range);


  const response =
    await fetch(url,{
      headers:{
        Authorization:
          "Bearer " + accessToken
      }
    });


  if(!response.ok){

    const text =
      await response.text();

    throw new Error(text);
  }


  const data =
    await response.json();


  const values =
    data.values || [];


  let foundRow = null;


  for(let i = 0; i < values.length; i++){

    const name =
      values[i][0];

    if(
      name === undefined ||
      String(name).trim() === ""
    ){

      foundRow = i + 2;

      break;
    }
  }


  if(foundRow === null){

    foundRow =
      values.length + 2;
  }


  nextRow = foundRow;

  setRowStatus(nextRow);

  return nextRow;
}


/* =========================================================
   START SCANNER
   ========================================================= */

function startScanner(){

  if(scanner){
    return;
  }


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode:{
        exact:"environment"
      }
    },

    {
      fps:10,

      qrbox:{
        width:280,
        height:280
      },

      aspectRatio:1.0,

      disableFlip:false

    },

    onScanSuccess,

    onScanFailure

  ).then(() => {

    scanning = true;

    setScannerStatus("Active");

    setStatus(
      "QR code scan karein",
      "ready"
    );

  }).catch(async error => {

    console.error(error);


    try{

      await scanner.start(

        {
          facingMode:"environment"
        },

        {
          fps:10,

          qrbox:{
            width:280,
            height:280
          },

          aspectRatio:1.0
        },

        onScanSuccess,

        onScanFailure

      );

      scanning = true;

      setScannerStatus("Active");

      setStatus(
        "QR code scan karein",
        "ready"
      );

    }catch(err){

      console.error(err);

      setScannerStatus("Error");

      setStatus(
        "Camera start nahi hua. Camera permission check karein.",
        "error"
      );
    }

  });
}


/* =========================================================
   STOP SCANNER
   ========================================================= */

async function stopScanner(){

  scanning = false;

  if(!scanner){
    return;
  }

  try{
    await scanner.stop();
  }catch(e){}

  try{
    scanner.clear();
  }catch(e){}

  scanner = null;

  setScannerStatus("Stopped");
}


/* =========================================================
   QR SCAN SUCCESS
   ========================================================= */

async function onScanSuccess(decodedText){

  if(!scanning || saving){
    return;
  }


  saving = true;
  scanning = false;


  /* IMMEDIATE BEEP */

  beep();


  setScannerStatus("Saving");

  setStatus(
    "QR scan ho gaya — data save ho raha hai...",
    "saving"
  );


  try{

    if(!accessToken){
      throw new Error(
        "Google account connected nahi hai."
      );
    }


    /*
       IMPORTANT:
       Har scan se pehle Column C dobara check.
       Isse wrong/random row use nahi hogi.
    */

    await findNextEntryRow();


    const rowNumber =
      nextRow;


    setRowStatus(rowNumber);


    /* QR → A:I */

    const row =
      convertQRToRow(decodedText);


    /*
       PINCODE is Column D
       Array index = 3
    */

    const pinCode =
      row[3] || "";


    /*
       Existing J:K read karein
       J = Courier
       K = Old Courier
    */

    const courierData =
      await readCourierData(rowNumber);


    let oldCourier =
      courierData.oldCourier;


    const existingCourier =
      courierData.courier;


    /*
       Agar K blank hai aur J me valid courier hai,
       to J ko K me preserve kar do.
    */

    if(
      (!oldCourier ||
       oldCourier === "#N/A") &&
      existingCourier &&
      existingCourier !== "#N/A"
    ){

      oldCourier =
        existingCourier;
    }


    /*
       PIN CODE sheet se Courier
    */

    const courier =
      await findCourierByPin(pinCode);


    /*
       Agar PIN match nahi hua
       to #N/A save hoga
    */

    const finalCourier =
      courier || "#N/A";


    /*
       Save
    */

    await saveEntry(
      rowNumber,
      row,
      finalCourier,
      oldCourier
    );


    setStatus(
      "Entry successfully saved ✓",
      "ready"
    );

    setSystemStatus("Saved");

    setScannerStatus("Saved");

    setRowStatus(rowNumber);


    /*
       Next row.
       Lekin next scan par C column dobara check hoga.
    */

    nextRow =
      rowNumber + 1;


    setTimeout(() => {

      saving = false;
      scanning = true;

      setStatus(
        "QR code scan karein",
        "ready"
      );

      setSystemStatus("Ready");

      setScannerStatus("Active");

    },300);


  }catch(error){

    console.error(error);


    saving = false;
    scanning = true;


    setStatus(
      "Entry save nahi hui",
      "error"
    );

    setSystemStatus("Error");

    setScannerStatus("Active");


    alert(
      "Entry save error:\n\n"
      + error.message
    );
  }
}


/* =========================================================
   QR DATA → A:I
   ========================================================= */

function convertQRToRow(qrText){

  const today =
    new Date().toLocaleDateString(
      "en-GB"
    );


  try{

    const obj =
      JSON.parse(qrText);


    const date =
      obj.date ||
      obj.Date ||
      today;


    const awb =
      obj.awb ||
      obj.AWB ||
      obj.awbNo ||
      obj.awb_no ||
      "";


    const name =
      obj.name ||
      obj.Name ||
      "";


    const destination =
      obj.destination ||
      obj.Destination ||
      obj.pincode ||
      obj.pinCode ||
      obj.pin ||
      "";


    const articleNo =
      obj.articleNo ||
      obj.article_no ||
      obj.article ||
      obj.Article ||
      "";


    const weight =
      obj.weight ||
      obj.Weight ||
      "";


    const mobile =
      obj.mobile ||
      obj.mobileNo ||
      obj.mobile_no ||
      obj.Mobile ||
      "";


    const order =
      obj.order ||
      obj.orderNo ||
      obj.order_no ||
      obj.Order ||
      "";


    const live =
      obj.live ||
      obj.liveNo ||
      obj.live_no ||
      obj.Live ||
      "";


    return [
      date,
      awb,
      name,
      destination,
      articleNo,
      weight,
      mobile,
      order,
      live
    ];

  }catch(e){

    /*
       Non-JSON QR
    */

    return [
      today,
      qrText,
      "",
      "",
      "",
      "",
      "",
      "",
      ""
    ];
  }
}


/* =========================================================
   READ J:K
   ========================================================= */

async function readCourierData(rowNumber){

  const range =
    SHEET_NAME +
    "!J" +
    rowNumber +
    ":K" +
    rowNumber;


  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/"
    + encodeURIComponent(SPREADSHEET_ID)
    + "/values/"
    + encodeURIComponent(range);


  const response =
    await fetch(url,{
      headers:{
        Authorization:
          "Bearer " + accessToken
      }
    });


  if(!response.ok){

    const text =
      await response.text();

    throw new Error(text);
  }


  const data =
    await response.json();


  const values =
    data.values || [];


  const row =
    values[0] || [];


  return {

    courier:
      row[0] !== undefined
        ? String(row[0]).trim()
        : "",

    oldCourier:
      row[1] !== undefined
        ? String(row[1]).trim()
        : ""
  };
}


/* =========================================================
   PIN → COURIER
   ========================================================= */

async function findCourierByPin(pinCode){

  const range =
    PIN_SHEET_NAME + "!A:B";


  const url =
    "https://sheets.googleapis.com/v4/spreadsheets/"
    + encodeURIComponent(SPREADSHEET_ID)
    + "/values/"
    + encodeURIComponent(range);


  const response =
    await fetch(url,{
      headers:{
        Authorization:
          "Bearer " + accessToken
      }
    });


  if(!response.ok){

    const text =
      await response.text();

    throw new Error(text);
  }


  const data =
    await response.json();


  const values =
    data.values || [];


  const searchPin =
    String(pinCode || "").trim();


  if(!searchPin){
    return "";
  }


  for(const item of values){

    const pin =
      item[0] !== undefined
        ? String(item[0]).trim()
        : "";


    const courier =
      item[1] !== undefined
        ? String(item[1]).trim()
        : "";


    if(
      pin === searchPin &&
      courier
    ){

      return courier;
    }
  }


  return "";
}


/* =========================================================
   SAVE ENTRY
   ========================================================= */

async function saveEntry(
  rowNumber,
  row,
  courier,
  oldCourier
){

  /*
     Existing A:I read karke AWB preserve karna
     agar new QR me AWB blank ho.
  */

  const existingRange =
    SHEET_NAME +
    "!A" +
    rowNumber +
    ":I" +
    rowNumber;


  const existingUrl =
    "https://sheets.googleapis.com/v4/spreadsheets/"
    + encodeURIComponent(SPREADSHEET_ID)
    + "/values/"
    + encodeURIComponent(existingRange);


  const existingResponse =
    await fetch(existingUrl,{
      headers:{
        Authorization:
          "Bearer " + accessToken
      }
    });


  if(!existingResponse.ok){

    const text =
      await existingResponse.text();

    throw new Error(text);
  }


  const existingData =
    await existingResponse.json();


  const existingRow =
    (existingData.values || [])[0] || [];


  /*
     Agar new QR AWB blank hai,
     existing AWB ko preserve karo.
  */

  if(
    (!row[1] ||
     String(row[1]).trim() === "") &&
    existingRow[1]
  ){

    row[1] =
      existingRow[1];
  }


  /*
     A:I
  */

  const aiRange =
    SHEET_NAME +
    "!A" +
    rowNumber +
    ":I" +
    rowNumber;


  const aiUrl =
    "https://sheets.googleapis.com/v4/spreadsheets/"
    + encodeURIComponent(SPREADSHEET_ID)
    + "/values/"
    + encodeURIComponent(aiRange)
    + "?valueInputOption=USER_ENTERED";


  const aiResponse =
    await fetch(aiUrl,{
      method:"PUT",

      headers:{
        Authorization:
          "Bearer " + accessToken,

        "Content-Type":
          "application/json"
      },

      body:JSON.stringify({
        range:aiRange,
        majorDimension:"ROWS",
        values:[row]
      })
    });


  if(!aiResponse.ok){

    const text =
      await aiResponse.text();

    throw new Error(text);
  }


  /*
     J:K
     J = Courier
     K = Old Courier
  */

  const jkRange =
    SHEET_NAME +
    "!J" +
    rowNumber +
    ":K" +
    rowNumber;


  const jkUrl =
    "https://sheets.googleapis.com/v4/spreadsheets/"
    + encodeURIComponent(SPREADSHEET_ID)
    + "/values/"
    + encodeURIComponent(jkRange)
    + "?valueInputOption=RAW";


  const jkResponse =
    await fetch(jkUrl,{
      method:"PUT",

      headers:{
        Authorization:
          "Bearer " + accessToken,

        "Content-Type":
          "application/json"
      },

      body:JSON.stringify({

        range:jkRange,

        majorDimension:"ROWS",

        values:[
          [
            courier,
            oldCourier || ""
          ]
        ]

      })
    });


  if(!jkResponse.ok){

    const text =
      await jkResponse.text();

    throw new Error(text);
  }
}

async function prepareAudio(){

  try{

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    if(
      audioContext.state === "suspended"
    ){

      await audioContext.resume();
    }

  }catch(e){

    console.log(
      "Audio unavailable"
    );
  }
}


function beep(){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();
    }


    if(
      audioContext.state === "suspended"
    ){

      audioContext.resume();
    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.frequency.value =
      900;


    oscillator.type =
      "sine";


    gain.gain.value =
      0.12;


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.15
    );

  }catch(e){}
}
